<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статистика сетки AKM</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: bento board — one idea per tile, tiles sized by importance; huge numerals, flat colour blocks (ink, signal orange, electric blue, lime, lavender) on warm stone */
:root{
  color-scheme:light;
  --stone:#E9E8E3; --tile:#FFFFFF; --tile-2:#F4F3EF;
  --ink:#0D0D0F; --ink-2:#1A1A1E; --muted:#6B6B72; --faint:#A3A3A8; --line:#E4E3DE; --line-dark:rgba(255,255,255,.14);
  --orange:#FF4F1F; --blue:#2541FF; --lime:#D2F35B; --lavender:#CFC2FF; --peach:#FFD9C7;
  --up:#13924F; --down:#E1343F; --warn:#E07A00;
  --accent:#2541FF;
  --r:26px; --gap:10px;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.public #aiOpen,body.public #aiForm,body.public #sugg,body.public .ai-head p{display:none!important}
html,body{background:var(--stone)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:inherit}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.pos{color:var(--up)} .neg{color:var(--down)} .zero{color:var(--faint)}
*{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.2) transparent}

.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:var(--gap)}

/* header */
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:12px;padding:6px 0 14px}
.bar .brand{min-height:52px}
.bar .pills{justify-content:flex-end}
@media (max-width:1240px){.bar{grid-template-columns:minmax(0,1fr) auto}.bar .pills{grid-column:1/-1;justify-content:flex-start;min-height:0}}
@media (max-width:640px){.bar{grid-template-columns:minmax(0,1fr)}.bar .nav{justify-self:start}.pills{flex-wrap:wrap}}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{display:inline-flex;align-items:center;background:var(--tile);border-radius:999px;height:52px;padding:0 20px;flex:none}
.logo .akm{display:block;height:22px;width:auto}
.bar h1{margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:600;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.bar .meta{font-size:12px;color:var(--muted);margin-top:4px}
.pills{display:flex;flex-wrap:nowrap;gap:8px;min-height:52px;align-items:center}
.bar .nav{margin-inline:6px}
.pill{border:0;border-radius:999px;padding:0 18px;font-weight:500;background:var(--tile);display:inline-flex;align-items:center;gap:10px;white-space:nowrap;height:52px;transition:background .2s,box-shadow .2s}
.pill:hover{background:#fff;box-shadow:0 0 0 1.5px var(--ink) inset}
.pill.dark{background:var(--blue);color:#fff;padding-right:10px}
.pill.dark:hover{box-shadow:none;background:#1A33E0}
.arrow{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--ink);display:inline-grid;place-items:center;font-size:14px;line-height:1}
.pill:not(.dark) .arrow{background:var(--ink);color:#fff}

/* bento grid */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.t{background:var(--tile);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative;overflow:hidden}
.t.ink{background:var(--ink);color:#fff}
.t.orange{background:var(--orange);color:#fff}
.t.blue{background:var(--blue);color:#fff}
.t.lime{background:var(--lime)}
.t.lav{background:var(--lavender)}
.t.peach{background:var(--peach)}
.t.stone{background:var(--tile-2)}
.lab{font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;opacity:.72;display:flex;align-items:center;justify-content:space-between;gap:8px}
.huge{font-size:clamp(52px,6.4vw,96px);font-weight:600;letter-spacing:-.06em;line-height:.9}
.huge small{font-size:.36em;letter-spacing:-.02em;font-weight:500;margin-left:6px}
.big{font-size:clamp(40px,4.6vw,68px);font-weight:600;letter-spacing:-.055em;line-height:.92}
.sub{font-size:13px;opacity:.78}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18)}
.t:not(.ink):not(.orange):not(.blue) .tag{background:rgba(0,0,0,.07)}
.corner{position:absolute;bottom:18px;right:18px;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.2);color:inherit;font-size:16px}
.t.lime .corner,.t.lav .corner,.t.peach .corner{background:var(--ink);color:#fff}
.corner:hover{transform:rotate(45deg);transition:transform .2s}
.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}.s7{grid-column:span 7}.s6{grid-column:span 6}.s12{grid-column:1/-1}.r2{grid-row:span 2}
.grow{flex:1}
.netchart{margin:0 -24px -22px;flex:4 1 120px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end}
.netchart .chartbox{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.netchart svg{display:block;width:100%;height:100%;min-height:120px}
.netchart svg path{vector-effect:non-scaling-stroke}
.minibars svg{display:block;width:100%;height:auto}

/* AI tile */
.segd{display:inline-flex;background:rgba(0,0,0,.08);border-radius:999px;padding:3px}
.segd button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600}
.segd button[aria-pressed="true"]{background:var(--ink);color:#fff}
.segd button:disabled{opacity:.35;cursor:default}
.headline{font-size:clamp(20px,2.2vw,30px);font-weight:600;letter-spacing:-.035em;line-height:1.12;max-width:34ch;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:auto}
.vmore{margin:4px auto 0;height:44px}
.met{background:rgba(255,255,255,.62);border-radius:18px;padding:10px 14px;min-width:0}
.met b{display:block;font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.2;overflow-wrap:anywhere}
.met b.sm{font-size:15px;letter-spacing:-.01em;overflow-wrap:normal;word-break:break-word}
.met span{font-size:11.5px;color:rgba(0,0,0,.6)}
.met.up b{color:var(--up)} .met.down b{color:var(--down)} .met.warn b{color:var(--warn)}

/* live counter (black tile) */
.t.live{isolation:isolate}
.t.live::before,.t.live::after{content:"";position:absolute;z-index:-1;width:520px;height:520px;border-radius:50%;pointer-events:none;will-change:transform}
.t.live::before{background:radial-gradient(circle,rgba(210,243,91,.16),transparent 62%);top:-260px;right:-200px;animation:lv-drift 19s ease-in-out infinite alternate}
.t.live::after{background:radial-gradient(circle,rgba(37,65,255,.3),transparent 64%);bottom:-300px;left:-240px;animation:lv-drift 23s ease-in-out -7s infinite alternate-reverse}
@keyframes lv-drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-60px,50px,0) scale(1.12)}100%{transform:translate3d(40px,-30px,0) scale(.94)}}
.lv-badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 11px 5px 9px;font-size:11px;font-weight:700;letter-spacing:.08em;background:rgba(255,255,255,.1)}
.lv-badge{margin-left:auto}.lab:has(.lv-badge) .hq{margin-left:0}
.lv-dot{position:relative;width:8px;height:8px;border-radius:50%;background:#FF3B3B;flex:none}
.lv-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#FF3B3B;animation:lv-ping 1.8s cubic-bezier(0,0,.2,1) infinite}
@keyframes lv-ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(3.2);opacity:0}}
.odo-wrap{position:relative;margin-top:4px}
.odo{display:flex;align-items:center;font-weight:600;letter-spacing:-.02em;font-size:84px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.odo .dg{position:relative;display:inline-block;width:var(--dw,.64em);height:1.16em;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.odo .reel{position:absolute;left:0;top:0;width:100%;will-change:transform;transition:transform .62s cubic-bezier(.2,1.25,.35,1)}
.odo .reel.fast{transition-duration:.28s;transition-timing-function:cubic-bezier(.3,.9,.4,1)}
.odo .reel.snap{transition:none}
.odo .reel span{display:block;height:1.16em;line-height:1.16em;text-align:center}
.odo .dg.fl span{animation:lv-flash 1.1s ease-out}
@keyframes lv-flash{0%{color:var(--lime)}100%{color:#fff}}
.odo .sp{display:inline-block;width:.24em}
.lv-pop{position:absolute;right:0;top:30%;font-size:15px;font-weight:700;color:var(--lime);pointer-events:none;animation:lv-pop 1.6s cubic-bezier(.2,.8,.3,1) forwards;font-variant-numeric:tabular-nums}
@keyframes lv-pop{0%{opacity:0;transform:translate3d(0,10px,0) scale(.7)}15%{opacity:1;transform:translate3d(0,-6px,0) scale(1)}100%{opacity:0;transform:translate3d(var(--dx,8px),-46px,0) scale(.9)}}
.lv-rate b{font-weight:600;color:var(--lime)}
.lv-ms{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.lv-ms .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;opacity:.82}
.lv-ms .row b{font-weight:600}
.lv-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.lv-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--lime));transform-origin:0 50%;transition:transform 1.2s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.lv-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:lv-shine 3.2s ease-in-out infinite}
@keyframes lv-shine{0%,40%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.lv-chart{position:relative;flex:1 1 200px;min-height:190px;margin:6px -24px -22px}
.t.live .lv-chart .netchart{position:absolute;inset:0;margin:0;min-height:0}
.t.live .netchart .chartbox,.t.live .netchart svg{position:absolute;inset:0;width:100%;height:100%;min-height:0}
.lv-cap{position:absolute;top:2px;left:24px;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;opacity:.5}
@media (max-width:640px){.lv-chart{margin:6px -18px -18px}.lv-cap{left:18px}.lv-foot{left:18px!important}}
.t.live .netchart circle{display:none}
.lv-end{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;will-change:transform}
.lv-end::after{content:"";position:absolute;inset:0;border-radius:50%;background:#fff;animation:lv-ring 2.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes lv-ring{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.9);opacity:0}}
/* растянутый график: штриховка через pathLength у non-scaling-stroke считается неверно и линия «не дорисовывается» —
   поэтому здесь появление шторкой слева направо, линия всегда целая */
.enter .t.live .ln{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
.enter .t.live .ar{animation:none}
.enter .t.live .netchart svg{animation:lv-reveal 1.15s cubic-bezier(.65,0,.35,1) .28s both}
@keyframes lv-reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.enter .lv-end{animation:lv-in .55s cubic-bezier(.2,1.4,.4,1) 1.3s both}
@keyframes lv-in{from{transform:scale(0);opacity:0}}
.lv-end.bump{animation:lv-bump .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes lv-bump{40%{transform:scale(1.3)}}
.lv-foot{position:absolute;left:24px;right:24px;bottom:14px;font-size:11px;opacity:.6;z-index:1}

#tblLab{justify-content:flex-start}#tblLab .hq{margin-left:8px}
.h48{display:block;width:100%;height:auto}
mark.hl{color:inherit;background:linear-gradient(104deg,transparent .3em,#FFE45C .4em,#FFE45C 92%,transparent 96%);background-size:100% 62%;background-position:0 78%;background-repeat:no-repeat;padding:0 .12em;margin:0 -.04em;border-radius:.18em;-webkit-box-decoration-break:clone;box-decoration-break:clone}mark.hl[data-u]{cursor:pointer}mark.hl[data-u]:hover{background-size:100% 100%;background-position:0 50%}
/* insight section tiles */
.ilist{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border:0;border-top:1px solid rgba(0,0,0,.09);background:none;text-align:left;width:100%}
.irow:first-child{border-top:0;padding-top:2px}
.irow .u{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.irow:hover .u{text-decoration:underline}
.irow .v{font-family:var(--f-mono);font-size:12.5px;font-weight:500;white-space:nowrap}
.irow .x2{grid-column:1/-1;font-size:12.5px;color:rgba(0,0,0,.6);line-height:1.35}
.irow .u:empty,.irow .v:empty{display:none}
.irow:has(.u:empty) .x2{color:var(--ink);font-size:13.5px}
.t.lime .irow .v.pos{color:#0B6E3A}

/* groups */
.grows{display:flex;flex-direction:column;gap:12px}
.grow-i{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.grow-i .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.grow-i .nm{font-weight:600}
.grow-i .nums{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.track{height:10px;border-radius:999px;background:var(--tile-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.grow-i[aria-pressed="true"] .track i{background:var(--blue)}
.grow-i:hover .nm{text-decoration:underline}

/* signals */
.sigs{display:flex;flex-direction:column}
.sg{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.sg:first-child{border-top:0;padding-top:0}
.sg .dt{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px;background:var(--blue)}
.sg .dt.crit{background:var(--down)} .sg .dt.warn{background:var(--warn)}
.sg b{font-weight:600}
button.sg:hover b{text-decoration:underline}
.linkbtn{border:0;background:var(--tile-2);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}

/* table tile */
.tt-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.tt-head h2{margin:0;font-size:clamp(22px,2.4vw,32px);font-weight:600;letter-spacing:-.04em;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--tile-2);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:500}
.chip:hover{background:#ECEBE6}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg{display:inline-flex;background:var(--tile-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tbl-wrap{overflow:hidden}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:0;max-width:230px;overflow:hidden;text-overflow:ellipsis}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
th.now,td.now{background:var(--tile-2)}
th.delta{color:var(--ink)}
td.n{font-family:var(--f-mono);font-size:13px}
table.daily td.n{font-size:12px}
table.daily th,table.daily td{padding-inline:5px}
table.daily th:first-child,table.daily td:first-child{padding-left:0}
tr.acc{cursor:pointer}
tr.acc:hover td{background:#FAF9F6}
tr.acc:hover td.now{background:#EFEEE9}
tr.grp td{border-bottom:0;padding-top:24px;font-weight:600}
tr.grp td:first-child{font-size:15px;letter-spacing:-.02em}
tr.grp td.n{color:var(--muted);font-weight:500}
tr.total td{border-top:2px solid var(--ink);border-bottom:0;font-weight:600;padding-top:13px}
tr.total td:first-child{font-size:15px;letter-spacing:-.02em}
.acc-cell{display:flex;align-items:center;gap:9px;min-width:0}
.acc-cell .nm{overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--blue)}
.dot.crit{background:var(--down)} .dot.warn{background:var(--warn)}
.foot{font-size:12px;color:var(--muted);margin:0;max-width:110ch}
td.heat{position:relative}
td.heat .pc{position:absolute;top:4px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.45}
th .wd{display:block;font-size:9.5px;letter-spacing:.04em;opacity:.7}
th.we,td.we{border-left:1px dashed #D6D5CF}

/* responsive */
@media (max-width:1100px){.s5,.s4,.s7,.s6{grid-column:span 6}.s3{grid-column:span 3}.r2{grid-row:auto}.bento.top .s3{grid-column:span 6}}
@media (max-width:1040px){.c-d7,.c-wk,.c-pct{display:none}}
@media (max-width:820px){.c-d4{display:none}.s3{grid-column:span 6}}
@media (max-width:640px){.bento{grid-template-columns:minmax(0,1fr)}.bento>*{grid-column:1/-1!important}.t{padding:18px}.c-d2,.c-wk0,.c-w4{display:none}td.n{font-size:12px}table.daily td.n{font-size:11px}th,td{padding-inline:5px}th:first-child,td:first-child{max-width:112px}.netchart{margin:auto -18px -18px}}

/* dialogs */
dialog{border:0;padding:0;background:var(--stone);color:var(--ink);border-radius:30px;width:100%;max-width:min(940px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 40px 100px -30px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(13,13,15,.45)}
.dlg{padding:12px;overflow:auto;max-height:calc(100dvh - 24px)}
.dgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--gap)}
.dgrid .t{padding:20px 22px}
.d6{grid-column:1/-1}.d3{grid-column:span 3}.d2{grid-column:span 2}.d4{grid-column:span 4}
@media (max-width:700px){.dgrid>*{grid-column:1/-1!important}}
.x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:20px;line-height:1;display:grid;place-items:center}
.lnks{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.lnk{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:500;text-decoration:none}
.lnk:hover{background:rgba(255,255,255,.24)}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;opacity:.75}
.kv b{font-size:22px;font-weight:600;letter-spacing:-.04em}
.kvs{display:flex;flex-wrap:wrap;gap:16px 26px;margin-top:auto}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bestrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 14px;padding:12px 0;border-top:1px solid rgba(0,0,0,.1)}
.bestrow:first-of-type{border-top:0;padding-top:0}
.bestrow .bd b{display:block;font-size:22px;font-weight:600;letter-spacing:-.04em;line-height:1}
.bestrow .bd span{font-family:var(--f-mono);font-size:13px;font-weight:500}
.bp{display:flex;flex-direction:column;gap:6px;min-width:0}
.bp>div{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.lbl{font-size:11px;color:rgba(0,0,0,.6);width:80px;flex:none;text-transform:uppercase;letter-spacing:.04em}
.plink{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;text-decoration:none;white-space:nowrap;font-weight:500}
.plink:hover{background:var(--blue)}
.daylist{max-height:380px;overflow:auto}
.daylist table{min-width:0}
.daylist th{position:sticky;top:0;background:#fff;z-index:1}
.daylist th,.daylist td{padding:9px 8px}
.daylist td.posts{text-align:left;white-space:normal}
.daylist td.posts .plink{margin:2px 4px 2px 0;background:var(--tile-2);color:var(--ink)}
.daylist td.posts .plink:hover{background:var(--ink);color:#fff}
.daylist tr.hl td{background:var(--lime)}
.sgn{display:flex;flex-direction:column;gap:6px}
.sgn div{display:flex;gap:10px;align-items:flex-start}
.sgn .dt{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:var(--blue)}
.sgn .dt.crit{background:var(--down)} .sgn .dt.warn{background:var(--warn)}

dialog.ai{margin-right:12px;margin-top:12px;height:calc(100dvh - 24px);max-height:calc(100dvh - 24px);max-width:min(520px,calc(100vw - 24px))}
.ai-body{display:flex;flex-direction:column;height:100%;padding:12px;gap:var(--gap)}
.ai-head{background:var(--ink);color:#fff;border-radius:var(--r);padding:20px 22px;position:relative}
.ai-head h2{margin:0;font-size:26px;font-weight:600;letter-spacing:-.04em}
.ai-head p{margin:6px 0 0;font-size:12px;opacity:.7;max-width:36ch}
.ai-head .x{background:rgba(255,255,255,.14);color:#fff}
.ai-body>*{flex:none}
.msgs{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding:2px}
.msg{flex:none;max-width:92%;padding:12px 15px;border-radius:20px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff}
.msg.bot{align-self:flex-start;background:#fff}
.msg.report{max-width:100%;width:100%;padding:0;overflow:hidden;background:#fff}
.rep-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--lime)}
.rep-h b{font-size:15px;letter-spacing:-.02em}
.rep-h span{display:block;font-size:12px;color:rgba(0,0,0,.6)}
.rep-copy{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;flex:none}
.msg.report pre{margin:0;padding:14px 16px 16px;font-family:var(--f-mono);font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:52vh;overflow:auto}
.msg p{margin:0 0 6px} .msg p:last-child{margin:0} .msg ul{margin:4px 0;padding-left:18px}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{flex:none;white-space:nowrap}
.sugg .chip{background:#fff}
.ai-form{display:flex;gap:8px;background:#fff;border-radius:var(--r);padding:8px 8px 8px 16px;margin-bottom:env(safe-area-inset-bottom,0px)}
.ai-form textarea{flex:1;min-width:0;resize:none;border:0;background:none;color:var(--ink);padding:8px 0;font:inherit;height:56px;outline:none}
.ai-form .pill{align-self:flex-end}
.toast{position:fixed;z-index:5;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px}
/* navigation */
.nav{position:relative;display:inline-flex;align-items:center;height:52px;background:var(--ink);border-radius:999px;padding:4px;gap:2px;box-shadow:0 10px 24px -14px rgba(13,13,15,.55)}
.nav a{position:relative;z-index:1;text-decoration:none;color:rgba(255,255,255,.62);font-weight:600;font-size:14px;height:44px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;transition:color .35s}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]:hover{color:var(--ink)}
.nav a .cnt{font-size:11px;font-weight:700;background:rgba(255,255,255,.14);border-radius:999px;padding:2px 7px;transition:background .35s}
.nav a[aria-current="page"] .cnt{background:rgba(13,13,15,.12)}
.nav a.ext{color:rgba(255,255,255,.62)}
.nav a.ext:hover{color:#fff}
.nav .ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;background:var(--lime);border-radius:999px;transform:translateX(0);will-change:transform;transition:transform .55s cubic-bezier(.16,1,.3,1),width .55s cubic-bezier(.16,1,.3,1)}
.nav.no-anim .ind{transition:none}
.page{display:flex;flex-direction:column;gap:var(--gap)}
body.booting .page{opacity:0}
.page{transition:opacity .2s}
/* page switch: transform + opacity only (composited, 60fps) */
.page.leave{animation:page-out .2s cubic-bezier(.4,0,1,1) both;pointer-events:none}
@keyframes page-out{to{opacity:0;transform:translate3d(0,-10px,0) scale(.992)}}
.enter .t,.enter .chips2{will-change:transform,opacity;animation:tile-in .72s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 42ms)}
.enter.fwd .t,.enter.fwd .chips2{animation-name:tile-in-r}
.enter.back .t,.enter.back .chips2{animation-name:tile-in-l}
@keyframes tile-in{from{opacity:0;transform:translate3d(0,26px,0) scale(.982)}}
@keyframes tile-in-r{from{opacity:0;transform:translate3d(46px,14px,0) scale(.982)}}
@keyframes tile-in-l{from{opacity:0;transform:translate3d(-46px,14px,0) scale(.982)}}
.page.leave.fwd{animation-name:page-out-l}
.page.leave.back{animation-name:page-out-r}
@keyframes page-out-l{to{opacity:0;transform:translate3d(-28px,0,0) scale(.99)}}
@keyframes page-out-r{to{opacity:0;transform:translate3d(28px,0,0) scale(.99)}}
/* data reveals: lines draw, bars grow, tracks stretch */
.enter .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.15s cubic-bezier(.65,0,.35,1) .28s forwards}
.enter .ar{animation:fade-only .9s ease .55s both}
.enter .gb{transform-box:fill-box;transform-origin:50% 100%;animation:grow-y .75s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--j,0) * 22ms + .22s)}
.enter .gb.dn{transform-origin:50% 0}
.enter .track i,.enter .bar2 i{transform-origin:0 50%;animation:grow-x 1s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--j,0) * 70ms + .3s)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade-only{from{opacity:0}}
@keyframes grow-y{from{transform:scaleY(0)}}
@keyframes grow-x{from{transform:scaleX(0)}}
/* dialogs: spring in, quick out */
dialog[open]{animation:dlg-in .6s cubic-bezier(.16,1,.3,1)}
dialog[open]::backdrop{animation:bd-in .35s ease}
dialog.closing{animation:dlg-out .22s cubic-bezier(.4,0,1,1) forwards}
dialog.closing::backdrop{animation:bd-out .22s ease forwards}
dialog.ai[open]{animation:ai-in .55s cubic-bezier(.16,1,.3,1)}
dialog.ai.closing{animation:ai-out .22s cubic-bezier(.4,0,1,1) forwards}
@keyframes dlg-in{from{opacity:0;transform:translate3d(0,34px,0) scale(.95)}}
@keyframes dlg-out{to{opacity:0;transform:translate3d(0,16px,0) scale(.97)}}
@keyframes ai-in{from{opacity:0;transform:translate3d(48px,0,0)}}
@keyframes ai-out{to{opacity:0;transform:translate3d(36px,0,0)}}
@keyframes bd-in{from{opacity:0}}
@keyframes bd-out{to{opacity:0}}
.huge,.big{font-variant-numeric:tabular-nums}

/* competitors page */
.cmp{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.cmp .row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:12.5px}
.cmp .bar2{height:12px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}

.cmp .row.them .bar2 i{background:var(--orange)}

.spk-who{font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-.04em;line-height:1.05;overflow-wrap:anywhere}
.chips2{display:flex;flex-wrap:wrap;gap:6px}

.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcard{background:var(--tile-2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;text-decoration:none;color:inherit;transition:transform .25s cubic-bezier(.16,1,.3,1),background .25s}

.pcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .x{position:static;width:auto;height:auto;background:var(--lime);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:4px 9px;display:inline-block}
.pcard .lk{font-size:34px;font-weight:600;letter-spacing:-.05em;line-height:1}
.pcard .lk small{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:4px}
.pcard .cap{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.9em}
.pcard .meta2{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:auto}
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.srow:first-child{border-top:0;padding-top:0}
.srow .k{background:var(--orange);color:#fff;border-radius:12px;font-weight:700;font-size:13px;text-align:center;padding:7px 0}
.srow .w{min-width:0}
.srow .w b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .w span{font-size:12px;color:var(--muted)}
.srow .g{font-family:var(--f-mono);font-weight:500;color:var(--up);white-space:nowrap}
button.srow:hover b{text-decoration:underline}
.rank td:first-child{max-width:none}
.rank .num{font-family:var(--f-mono);color:var(--faint);width:28px}
.rank .nich{font-size:12px;color:var(--muted)}
.spark{display:block;width:90px;height:26px;margin-left:auto}
.empty-t{color:var(--muted);font-size:13.5px;line-height:1.5;max-width:60ch}
@media (max-width:640px){.chips2{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.chips2 .chip{flex:none}.cmp .row{grid-template-columns:90px minmax(0,1fr) auto}.rank .c-hide{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
/* карточки постов: превью + формат + сила залёта */
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pc2{display:flex;flex-direction:column;background:var(--tile-2);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;
  transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s}
.pc2:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(13,13,15,.10)}
.pc-img{position:relative;aspect-ratio:4/5;background:color-mix(in srgb,var(--fc) 18%,var(--tile-2));overflow:hidden}
.pc-img img{width:100%;height:100%;object-fit:cover;display:block}
.pc-ph{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:var(--fc);opacity:.7}

  box-shadow:0 2px 10px rgba(0,0,0,.18)}

  padding:6px 9px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.pc-x.warm{background:var(--lime);color:var(--ink)}
.pc-x.hot{background:var(--orange);color:#fff}
.pc-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc-hook{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc-meta{font-size:12.5px;color:var(--ink);margin-top:auto}
.pc-gain{font-size:12.5px;background:#E6F6EC;color:#0B6E3A;border-radius:10px;padding:6px 9px;line-height:1.3}
.pc-gain b{font-size:15px;letter-spacing:-.02em}.pc-gain span{color:#3F7A57}
table.trk th .ts{border:0;background:none;padding:0;font:inherit;color:inherit;white-space:nowrap}
table.trk th .ts:hover{color:var(--ink)}
@media (max-width:640px){.nav{max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}.nav a{padding:0 14px;flex:none}}
/* «Конкуренты»: переключатель режимов + бенто отслеживаемых */
.cmc-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.cmc{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:stretch;gap:16px;min-height:150px;padding:22px 24px;border:0;border-radius:var(--r);background:var(--tile);color:var(--ink);text-align:left;
  transition:background-color .55s cubic-bezier(.16,1,.3,1),color .45s,transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s}
.cmc:not(.on):hover{transform:translateY(-3px);box-shadow:0 18px 40px -26px rgba(13,13,15,.45)}
.cmc.on{background:var(--ink);color:#fff;cursor:default}
.cmc::before,.cmc::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .8s}
.cmc::before{width:420px;height:420px;top:-230px;right:-150px;background:radial-gradient(circle,rgba(210,243,91,.22),transparent 62%);animation:lv-drift 17s ease-in-out infinite alternate}
.cmc::after{width:460px;height:460px;bottom:-300px;left:-160px;background:radial-gradient(circle,rgba(37,65,255,.42),transparent 64%);animation:lv-drift 21s ease-in-out -6s infinite alternate-reverse}
.cmc.on::before,.cmc.on::after{opacity:1}
.cmc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cmc-top{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.cmc-top b{font-family:var(--f-mono);font-weight:600;letter-spacing:0}
.cmc.on .cmc-top{opacity:.85}
.cmc-sq{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.6}
.cmc-t{margin-top:auto;font-size:clamp(26px,2.6vw,38px);font-weight:600;letter-spacing:-.045em;line-height:1}
.cmc-d{font-size:13px;line-height:1.35;opacity:.62;max-width:40ch}
.cmc-art{flex:none;width:150px;position:relative;align-self:center;height:110px}
.cmc-fan img{position:absolute;top:50%;left:50%;width:66px;height:92px;object-fit:cover;border-radius:12px;border:3px solid var(--tile);box-shadow:0 10px 24px -12px rgba(0,0,0,.5);
  transform:translate(-50%,-50%) translateX(calc(var(--k) * 34px)) rotate(calc(var(--k) * 9deg));transition:transform .6s cubic-bezier(.16,1,.3,1),border-color .55s}
.cmc-fan img:nth-child(2){z-index:1}
.cmc.on .cmc-fan img{border-color:var(--ink)}
.cmc:hover .cmc-fan img{transform:translate(-50%,-50%) translateX(calc(var(--k) * 46px)) translateY(calc(var(--k) * var(--k) * 6px)) rotate(calc(var(--k) * 15deg))}
.cmc-ph{position:absolute;inset:18px 30px;border-radius:16px;background:var(--lime)}
.cmc-bars{display:flex;align-items:flex-end;gap:6px;padding:8px 0}
.cmc-bars i{flex:1;border-radius:6px 6px 3px 3px;background:var(--ink);opacity:.85;transform-origin:50% 100%;transition:background .55s}
.cmc.on .cmc-bars i{background:var(--lime);opacity:1}
.cmc:hover .cmc-bars i{animation:cmc-hop .7s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--j,0) * 35ms)}
@keyframes cmc-hop{40%{transform:scaleY(1.18)}}
.enter .cmc-fan img{animation:cmc-deal .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc((var(--k) + 1) * 80ms + .3s)}
@keyframes cmc-deal{from{opacity:0;transform:translate(-50%,-20%) rotate(0deg) scale(.7)}}
.enter .cmc-bars i{animation:grow-y .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--j,0) * 45ms + .3s)}
.enter .cmc{animation:tile-in .72s cubic-bezier(.16,1,.3,1) both}
.enter .cmc+.cmc{animation-delay:60ms}

<script type="text/x-main" id="main-js">
(() => {
const $ = id => document.getElementById(id);
const S = { groups: [], days: [], cgroups: [], cdays: [], cM: null, cFilter: "all", tFilter: "all", tSort: { k: "rate", dir: -1 }, cMode: "trk", page: null, insights: [], filter: "all", mode: "week", insTab: null, showAllSig: false, chat: [], sample: null, ctl: null, M: null };
try { if (localStorage.getItem("net.mode") === "day") S.mode = "day"; } catch (e) {}
const WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];

/* ---------- formatting ---------- */
const nf = new Intl.NumberFormat("ru-RU");
const fmt = n => n == null ? "—" : nf.format(Math.round(n));
const compact = n => {
  if (n == null) return "—";
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toLocaleString("ru-RU", { maximumFractionDigits: 2 }) + " млн";
  if (a >= 1e3) return (n / 1e3).toLocaleString("ru-RU", { maximumFractionDigits: a >= 1e5 ? 0 : 1 }) + " тыс";
  return nf.format(Math.round(n));
};
const signed = (n, f = fmt) => n == null ? "—" : (n > 0 ? "+" : n < 0 ? "−" : "") + f(Math.abs(n));
const pct = n => n == null || !isFinite(n) ? "—" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + "%";
const pct2 = n => n == null || !isFinite(n) ? "—" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toLocaleString("ru-RU", { minimumFractionDigits: Math.abs(n) < 1 ? 2 : 1, maximumFractionDigits: Math.abs(n) < 1 ? 2 : 1 }) + "%";
const cls = n => n == null ? "zero" : n > 0 ? "pos" : n < 0 ? "neg" : "zero";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dms = d => Date.parse(d + "T00:00:00Z");
const shift = (d, n) => new Date(dms(d) + n * 864e5).toISOString().slice(0, 10);
const dShort = d => { const [, m, dd] = d.split("-"); return `${dd}.${m}`; };
const dLong = d => new Date(dms(d)).toLocaleDateString("ru-RU", { day: "numeric", month: "long", timeZone: "UTC" });
const daysBetween = (a, b) => Math.round((dms(b) - dms(a)) / 864e5);
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const median = a => { const v = [...a].sort((x, y) => x - y), m = v.length >> 1; return v.length ? (v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2) : null; };

/* ---------- model ---------- */
function at(pts, date, maxAge = 3) {
  for (let i = pts.length - 1; i >= 0; i--) if (pts[i].d <= date) return daysBetween(pts[i].d, date) <= maxAge ? pts[i] : null;
  return null;
}

function erRatio(p) {
  const er = p.filter(x => x.er != null);
  if (er.length < 21) return null;
  const recent = avg(er.slice(-7).map(x => x.er)), base = avg(er.slice(-28, -7).map(x => x.er));
  return base >= 0.03 ? { r: recent / base, recent, base } : null;
}
function signals(a, latest, netR) {
  const out = [], p = a.pts, last = a.last;
  const add = (lvl, text, kind = "") => out.push({ lvl, text, u: a.u, kind });
  if (!last || !last.ok) { add("crit", /не найден/.test(last?.error || "") ? "не найден в Instagram — удалён, переименован или закрыт" : "не удалось собрать данные"); return out; }
  if (p.length < 2) return out;
  // mass post deletion
  for (let i = Math.max(1, p.length - 30); i < p.length; i++) {
    const a0 = p[i - 1].media, a1 = p[i].media;
    if (a0 > 20 && a1 != null && a1 < a0 * 0.8) { add("crit", `удалено ${fmt(a0 - a1)} ${plu(a0 - a1, "публикация", "публикации", "публикаций")} (${dShort(p[i].d)}) — архивация или ограничение аккаунта`); break; }
  }
  // Socialblade stopped updating
  let j = p.length - 1;
  while (j > 0 && p[j].followers === p[j - 1].followers) j--;
  const frozen = daysBetween(p[j].d, latest);
  if (frozen >= 4) add("warn", `цифры не меняются с ${dShort(p[j].d)} — сбор не обновляет страницу`);
  // followers dynamics
  if (a.w1pct != null && a.w1pct <= -1) add("crit", `резкая отписка: ${signed(a.w1)} за неделю (${pct(a.w1pct)})`, "growth");
  else if (a.w1pct != null && a.w1pct <= -0.3) add("warn", `теряет подписчиков: ${signed(a.w1)} за неделю (${pct(a.w1pct)})`, "growth");
  else if (a.w4pct != null && a.w4pct <= -0.5) add("warn", `теряет подписчиков месяц подряд: ${signed(a.w4)} за 4 недели`, "growth");
  const prev = at(p, shift(latest, -7)), prev2 = at(p, shift(latest, -14));
  const pw = prev && prev2 ? prev.followers - prev2.followers : null;
  if (a.w1 != null && pw != null && pw > 1000 && a.w1 >= 0 && a.w1 < pw * 0.15) add("warn", `рост встал: ${signed(a.w1)} за неделю против ${signed(pw)} неделей раньше`, "growth");
  // engagement drop (ER history from Socialblade)
  const e = erRatio(p);
  const posted = (p[p.length - 1].media ?? 0) > (at(p, shift(latest, -7))?.media ?? Infinity);
  if (e && netR != null && posted && e.r < 0.5 && e.r < netR * 0.5) {
    const weakGrowth = out.some(x => x.kind === "growth");
    add(weakGrowth ? "warn" : "info", weakGrowth
      ? `возможен теневой бан: ER упал до ${e.recent.toFixed(2)}% (обычно ${e.base.toFixed(2)}%), и рост при этом встал`
      : `ER ниже обычного: ${e.recent.toFixed(2)}% против ${e.base.toFixed(2)}%, сильнее, чем по сетке`, "er");
  }
  // no posts
  const m7 = at(p, shift(latest, -14));
  if (m7 && last.media != null && last.media <= m7.media && frozen < 4) add("info", "нет новых публикаций 2+ недели");
  return out;
}

// «Обновлено сегодня в 18:55» — по времени выгрузки данных
const updLabel = iso => {
  if (!iso) return "";
  const t = new Date(iso), msk = x => new Date(x.getTime() + 3 * 36e5), a = msk(t), b = msk(new Date());
  const hm = `${String(a.getUTCHours()).padStart(2, "0")}:${String(a.getUTCMinutes()).padStart(2, "0")}`;
  const day = Math.round((Date.UTC(b.getUTCFullYear(), b.getUTCMonth(), b.getUTCDate()) - Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), a.getUTCDate())) / 864e5);
  return `Обновлено ${day === 0 ? "сегодня" : day === 1 ? "вчера" : a.getUTCDate() + " " + ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"][a.getUTCMonth()]} в ${hm} МСК`;
};
// ники в заголовке разбора — маркером; наши страницы кликабельны (открывают карточку)
const markHandles = (text, known = new Set()) => esc(text).replace(/@([A-Za-z0-9._]+[A-Za-z0-9_])/g, (m, u) =>
  known.has(u.toLowerCase()) ? `<mark class="hl" data-u="${u}" role="button" tabindex="0">${m}</mark>` : `<mark class="hl">${m}</mark>`);
const RANK = { crit: 3, warn: 2, info: 1 };
const plu = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };
function build(days0 = S.days, groups0 = S.groups) {
  const days = [...days0].sort((x, y) => x.date < y.date ? -1 : 1);
  const latest = days.length ? days[days.length - 1].date : null;
  let groups = groups0;
  if (!groups.length) {
    const map = new Map();
    for (const d of days) for (const [u, s] of Object.entries(d.stats || {})) { const g = s.group || "Без группы"; if (!map.has(g)) map.set(g, new Set()); map.get(g).add(u); }
    groups = [...map].map(([name, set]) => ({ name, accounts: [...set] }));
  }
  // Mondays: last 5 on or before latest
  const mondays = [];
  if (latest) {
    let d = latest; const wd = new Date(dms(d)).getUTCDay(); d = shift(d, -((wd + 6) % 7));
    for (let i = 0; i < 5; i++) mondays.unshift(shift(d, -7 * i));
  }
  while (mondays.length && !days.some(d => d.date <= mondays[0] && daysBetween(d.date, mondays[0]) <= 3)) mondays.shift();
  let showNow = latest && latest !== mondays[mondays.length - 1];
  const accounts = [];
  groups.forEach(g => g.accounts.forEach(u => {
    const all = []; for (const d of days) { const s = d.stats?.[u]; if (s) all.push({ d: d.date, ...s }); }
    const pts = all.filter(x => x.ok && x.followers != null);
    const last = all[all.length - 1] || null, lastOk = pts[pts.length - 1] || null;
    const cur = lastOk && latest && daysBetween(lastOk.d, latest) <= 3 ? lastOk.followers : null;
    const w1p = latest ? at(pts, shift(latest, -7)) : null, w4p = latest ? at(pts, shift(latest, -28)) : null;
    const a = { u, group: g.name, all, pts, last, lastOk, cur, sig: [], level: 0,
      mon: mondays.map(m => at(pts, m)?.followers ?? null),
      w1: cur != null && w1p ? cur - w1p.followers : null,
      w4: cur != null && w4p ? cur - w4p.followers : null };
    a.daily = pts.map((p, i) => {
      const prev = pts[i - 1], gap = prev ? daysBetween(prev.d, p.d) : 0;
      const known = p.posts || [], mDelta = prev && p.media != null && prev.media != null ? p.media - prev.media : null;
      return { d: p.d, f: p.followers, g: gap >= 1 && gap <= 3 ? p.followers - prev.followers : null, gap, posts: known, n: known.length || Math.max(0, mDelta ?? 0), mDelta };
    });
    a.dg = new Map(a.daily.map(x => [x.d, x]));
    a.w1pct = a.w1 != null ? a.w1 / w1p.followers * 100 : null;
    a.w4pct = a.w4 != null ? a.w4 / w4p.followers * 100 : null;
    accounts.push(a);
  }));
  if (!latest) return { days, latest, groups, mondays, showNow, accounts, net: [], netSig: null };
  const keep = mondays.map((_, i) => accounts.filter(x => x.mon[i] != null).length >= accounts.length / 2);
  if (keep.some(k => !k)) { for (const x of accounts) x.mon = x.mon.filter((_, i) => keep[i]); for (let i = mondays.length - 1; i >= 0; i--) if (!keep[i]) mondays.splice(i, 1); }
  const ratios = accounts.map(a => erRatio(a.pts)?.r).filter(r => r != null).sort((x, y) => x - y);
  const netR = ratios.length >= 5 ? ratios[ratios.length >> 1] : null;
  for (const a of accounts) { a.sig = signals(a, latest, netR); a.level = Math.max(0, ...a.sig.map(s => RANK[s.lvl])); }
  const netSig = netR != null && netR < 0.7 ? `вовлечённость падает по всей сетке: медианный ER за последнюю неделю на ${Math.round((1 - netR) * 100)}% ниже, чем за три недели до неё. Похоже на общее снижение охватов, а не на баны отдельных аккаунтов.` : null;
  // ряд сетки — «цепной»: последний день = текущая сумма, каждый предыдущий = следующий минус прирост тех аккаунтов,
  // у которых есть данные за оба дня. Новый аккаунт (или пропавшие данные) не дают ступеньки — только органика.
  const carry = accounts.map(a => { const m = new Map(); let v = null, i = 0; const P = a.pts;
    for (const d of days) { while (i < P.length && P[i].d <= d.date) v = P[i++].followers; if (v != null) m.set(d.date, v); } return m; });
  const net = days.map(d => ({ d: d.date, y: 0 }));
  if (net.length) {
    const L = net.length - 1; net[L].y = carry.reduce((s, m) => s + (m.get(net[L].d) ?? 0), 0);
    for (let i = L - 1; i >= 0; i--) {
      let g = 0; for (const m of carry) { const a0 = m.get(net[i].d), a1 = m.get(net[i + 1].d); if (a0 != null && a1 != null) g += a1 - a0; }
      net[i].y = net[i + 1].y - g;
    }
  }
  const dayCols = []; for (let i = 13; i >= 0; i--) dayCols.push(shift(latest, -i));
  return { days, latest, groups, mondays, showNow, accounts, net, netSig, dayCols };
}

/* ---------- charts ---------- */
function chart(el, pts, { w = 640, h = 200, fmtY = compact, bare = false, color = "var(--blue)", fill = .1, grid = "var(--line)", text = "var(--muted)", padR = 0 } = {}) {
  if (pts.length < 2) { el.innerHTML = `<div class="muted" style="font-size:12px">Мало данных для графика</div>`; return; }

function bars(el, days, onPick) {

  const W = 760, H = 210, L = 74, R = 8, T = 8, B = 46, n = days.length, bw = (W - L - R) / n;
  const gs = pts.map(x => x.g); let y1 = Math.max(0, ...gs), y0 = Math.min(0, ...gs); if (y1 === y0) y1 = 1;

  const ticks = [0, ...[y1, y0].filter(t => t !== 0 && Math.abs(Y(t) - z) > 16)];
  el.innerHTML = `<div class="bars"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Прирост подписчиков по дням">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${esc(signed(t, compact))}</text>`).join("")}
    ${days.map((x, i) => {

      const dot = x.n ? `<circle cx="${cx + bw / 2}" cy="${H - B + 14}" r="${Math.min(8, 4 + x.n)}" fill="var(--ink)"/><text x="${cx + bw / 2}" y="${H - B + 17.5}" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">${x.n}</text>` : "";
      const lab = i % 5 === 0 || i === n - 1 ? `<text x="${cx + bw / 2}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${dShort(x.d)}</text>` : "";

}

function spikesOf(a, latest, span = 14) {
  const out = [], d = a.daily;
  for (let i = 0; i < d.length; i++) {
    const x = d[i];

    const base = d.slice(Math.max(0, i - 14), i).map(y => y.g).filter(g => g != null);
    if (base.length < 5) continue;
    const norm = Math.max(median(base.map(Math.abs)), 30);
    if (x.g >= 300 && x.g >= norm * 3) out.push({ u: a.u, group: a.group, d: x.d, g: x.g, k: x.g / norm, x, prev: a.dg.get(shift(x.d, -1)) });
  }
  return out;
}
function topPosts(accounts, latest, days = 7) {
  const out = [];

    const all = a.daily.flatMap(x => x.posts.filter(p => p.l != null).map(p => ({ ...p, d: x.d })));
    if (all.length < 3) continue;
    const norm = Math.max(median(all.map(p => p.l)), 1);
    for (const p of all) if (p.d > shift(latest, -days)) out.push({ ...p, u: a.u, group: a.group, k: p.l / norm });

}

const RULES = `Ты — аналитик сети Instagram-аккаунтов агентства (агентство владеет аккаунтами и продаёт в них рекламу). Каждый понедельник команда фиксирует подписчиков по каждому аккаунту — это основа данных ниже. Отвечай по-русски, коротко, с конкретными цифрами и никами, без воды. Используй только эти данные; если чего-то не хватает — так и скажи.
Источник — Socialblade, цифры могут отставать на сутки. Признаки теневого бана: падение ER/лайков при том, что посты выходят; остановка роста; отток. Массовое удаление постов — архивация или ограничение. Нет постов — это пауза, а не бан.

function md(t) {
  let out = "", ul = false;
  for (const l of esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n")) {
    const m = l.match(/^\s*[-•*]\s+(.*)/);
    if (m) { if (!ul) { out += "<ul>"; ul = true; } out += `<li>${m[1]}</li>`; }
    else { if (ul) { out += "</ul>"; ul = false; } if (l.trim()) out += `<p>${l}</p>`; }
  }
  return out + (ul ? "</ul>" : "");
}
function weeklyReportText() {
  const M = S.M; if (!M?.latest) return null;
  const A = M.accounts, val = a => a.cur ?? a.lastOk?.followers ?? null;
  const delta = n => n == null ? "" : ` (${signed(n)})`;
  const sum = (list, k) => list.reduce((t, a) => t + ((k ? a[k] : val(a)) ?? 0), 0);
  const L = [`Подписчики · ${WD[new Date(dms(M.latest)).getUTCDay()]}, ${dLong(M.latest)}`, "В скобках — изменение за 7 дней", ""];
  for (const g of M.groups) {
    const ga = A.filter(a => a.group === g.name); if (!ga.length) continue;
    L.push(g.name);
    for (const a of ga) L.push(`${a.u} — ${fmt(val(a))}${delta(a.w1)}`);
    L.push(`Итого: ${fmt(sum(ga))}${delta(sum(ga, "w1"))}`, "");
  }
  L.push(`Вся сетка: ${fmt(sum(A))}${delta(sum(A, "w1"))}`);
  return L.join("\n");
}

}

async function ask(q) {

  if (REPORT_RE.test(q)) { $("aiInput").value = ""; return runReport(q); }
  if (!S.sample) { S.chat.push({ role: "user", content: q }, { role: "assistant", content: "Свободные вопросы к ИИ работают, когда страница открыта в Claude. Команда /отчёт доступна всегда." }); $("aiInput").value = ""; return renderChat(); }
  S.chat.push({ role: "user", content: q });

  } catch (e) {

  } finally { S.ctl = null; $("aiSend").disabled = false; $("aiStop").hidden = true; renderChat(); }
}

  S.insights.map(i => i.date + i.type + (i.headline || i.summary || "").length).join()].join("|");
function reveal() {

  document.body.classList.remove("booting");
  placeInd(false);
  enter(pageEl(S.page));
}
function dataIn(key) {
  S.seen.add(key);
  if (!S.ready) { if (NEED.every(k => S.seen.has(k))) { clearTimeout(dataIn.t); dataIn.t = setTimeout(reveal, 60); } return; }
  clearTimeout(dataIn.t);
  const run = () => {
    const pg = pageEl(S.page); if (pg.classList.contains("enter")) { dataIn.t = setTimeout(run, 400); return; }
    const sig = dataSig(); if (sig === S.sig) return; // same data — nothing to redraw

  dataIn.t = setTimeout(run, 120);
}

})();
})();

const keys = Object.keys(H).sort((a, b) => b.length - a.length);
const css = document.createElement("style");
css.textContent = `.lab:has(.hq){justify-content:flex-start}.lab:has(.hq) .tag{margin-left:auto}
.lab .hq{margin-left:auto;order:99}.lab:has(.tag) .hq{margin-left:0}
.hq{display:inline-flex;align-items:center;justify-content:center;flex:none;width:20px;height:20px;border-radius:50%;
border:1px solid currentColor;opacity:.45;font:600 11px/1 inherit;cursor:pointer;background:none;color:inherit;vertical-align:middle;padding:0;transition:opacity .15s}
.hq:hover,.hq:focus-visible{opacity:1}
.hpop{position:absolute;z-index:9999;max-width:min(380px,calc(100vw - 32px));background:#111;color:#fff;border-radius:16px;padding:14px 16px;
font:400 13px/1.45 inherit;white-space:pre-line;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.hpop b{display:block;margin-bottom:6px;font-weight:600}.hpop .s{display:block;margin-top:8px;opacity:.6;font-size:12px}`;
document.head.appendChild(css);
let pop = null;
const close = () => { pop?.remove(); pop = null; };
function open(btn, key) {
  close();
  pop = document.createElement("div");
  pop.className = "hpop";
  pop.innerHTML = `<b></b><span></span><span class="s"></span>`;
  pop.children[0].textContent = key; pop.children[1].textContent = H[key]; pop.children[2].textContent = SRC;
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth;
  pop.style.left = Math.max(16, Math.min(scrollX + r.left - 12, scrollX + innerWidth - w - 16)) + "px";
  pop.style.top = (scrollY + r.bottom + 8) + "px";
}
document.addEventListener("click", e => {
  const b = e.target.closest(".hq");
  if (b) { e.preventDefault(); e.stopPropagation(); pop && pop.dataset.k === b.dataset.k ? close() : (open(b, b.dataset.k), pop.dataset.k = b.dataset.k); return; }
  if (!e.target.closest(".hpop")) close();
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
function scan() {
  document.querySelectorAll(".lab").forEach(l => {
    if (l.querySelector(".hq")) return;
    const t = (l.childNodes[0]?.textContent || "").trim();
    const k = keys.find(k => t.startsWith(k));
    if (!k) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "hq"; b.dataset.k = k; b.textContent = "?"; b.setAttribute("aria-label", "Как считается: " + k);
    l.appendChild(b);   // всегда в правом краю заголовка (после плашки, если она есть)
  });
}
// сразу, без задержки: колбэк наблюдателя выполняется до отрисовки кадра, поэтому «?» появляется вместе с блоком
// и заголовок не перестраивается на глазах (иначе плашки и переключатели прыгали вбок)
new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
scan();
})();
