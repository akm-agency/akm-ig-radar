<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Контентщик AKM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* В стиле сайта сетки: светлый камень, тёмные и лаймовые плитки. Сверху здоровье каналов, ниже очередь постов
   карточками; слайды листаются как в Instagram, по клику — полный размер. */
:root{
  color-scheme:light;
  --stone:#E9E8E3; --tile:#FFFFFF; --tile-2:#F4F3EF;
  --ink:#0D0D0F; --muted:#6B6B72; --faint:#A3A3A8; --line:#E4E3DE;
  --blue:#2541FF; --lime:#D2F35B; --lavender:#CFC2FF; --peach:#FFD9C7; --orange:#FF4F1F;
  --up:#13924F; --down:#E1343F;
  --r:24px; --gap:10px;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--stone);margin:0}
body{color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:inherit}
p,h1,h2,h3{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:var(--gap)}

/* шапка */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:4px 0 10px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{display:inline-grid;place-items:center;background:var(--ink);color:var(--lime);border-radius:999px;height:48px;padding:0 18px;font-weight:700;letter-spacing:-.02em;flex:none}
h1{font-size:clamp(24px,2.6vw,34px);font-weight:600;letter-spacing:-.04em;line-height:1}
.meta{font-size:12px;color:var(--muted);margin-top:5px}
.back{background:var(--tile);border-radius:999px;padding:10px 16px;font-weight:500;text-decoration:none;white-space:nowrap}
.back:hover{background:var(--tile-2)}

/* каналы */
.accs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--gap)}
.acc{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px 20px;display:grid;gap:16px}
.acc-hd{display:flex;align-items:center;gap:12px}
.acc-hd img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#333;flex:none}
.acc-hd b{font-weight:600;font-size:16px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-hd span{margin-left:auto;background:var(--lime);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num small{display:block;color:#9C9CA3;font-size:11.5px;line-height:1.3}
.num strong{display:block;font-size:clamp(24px,2.4vw,32px);font-weight:600;letter-spacing:-.04em;line-height:1.1;margin-top:4px}

/* фильтры */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0 2px}
.chip{background:var(--tile);border-radius:999px;padding:8px 14px;font-weight:500;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip i{font-style:normal;color:var(--faint);margin-left:4px}
.chip[aria-pressed="true"] i{color:#9C9CA3}
.sep{width:1px;height:22px;background:#D3D2CC;margin:0 4px}

/* посты */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:var(--gap);align-items:start}
.post{background:var(--tile);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--tile-2)}
.s-ready{background:var(--lime)} .s-approved{background:var(--blue);color:#fff} .s-published{background:var(--lavender)}
.s-rejected{background:var(--peach)} .s-rendered{background:#FFF1B8}
.who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;min-width:0}
.who img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.type{font-size:12px;color:var(--muted)}
.score{margin-left:auto;display:flex;align-items:baseline;gap:2px;font-weight:600;font-size:20px;letter-spacing:-.03em}
.score small{font-size:12px;color:var(--faint);font-weight:500}
.post h3{font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.25}

/* карусель */
.car{position:relative}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:14px;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 calc((100% - 6px)/1.6);scroll-snap-align:start;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--tile-2)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);
  box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center;font-size:18px;line-height:1}
.nav-btn.prev{left:8px} .nav-btn.next{right:8px}
.nav-btn:disabled{opacity:0;pointer-events:none}
.count{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.noimg{aspect-ratio:16/7;border-radius:14px;background:var(--tile-2);display:grid;place-items:center;color:var(--muted);font-size:13px}

/* разбор */
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar-i{background:var(--tile-2);border-radius:12px;padding:8px 10px}
.bar-i small{display:block;font-size:11px;color:var(--muted)}
.bar-i b{font-size:16px;font-weight:600}
details{border-top:1px solid var(--line);padding-top:10px}
details+details{border-top:0;padding-top:0}
summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
details[open] summary::after{content:"−"}
summary i{font-style:normal;color:var(--faint);font-weight:400;margin-left:6px}
.cap{white-space:pre-wrap;background:var(--tile-2);border-radius:12px;padding:12px;margin-top:8px;font-size:13.5px;overflow-wrap:anywhere}
ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
li{overflow-wrap:anywhere}
.ok li::marker{color:var(--up)}
.src a{color:var(--blue);word-break:break-all}
.foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:auto}
.copy{margin-left:auto;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:500;white-space:nowrap}
.copy.done{background:var(--up)}
.res{background:var(--lavender);border-radius:12px;padding:10px 12px;font-size:13px}
.empty{background:var(--tile);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

/* просмотр слайдов */
.lb{position:fixed;inset:0;background:rgba(8,8,10,.94);z-index:50;display:flex;align-items:center;justify-content:center;padding:56px 12px 64px}
.lb img{max-width:min(100%,560px);max-height:100%;border-radius:12px;display:block;user-select:none}
.lb .x{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;color:#fff;font-size:28px;width:44px;height:44px}
.lb .nav-btn{background:rgba(255,255,255,.14);color:#fff;width:48px;height:48px;box-shadow:none}
.lb .nav-btn.prev{left:max(10px,calc(50% - 340px))} .lb .nav-btn.next{right:max(10px,calc(50% - 340px))}
.lb .cnt{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#C9C9CE;font-size:13px}

@media (max-width:600px){
  .wrap{gap:8px;padding-top:12px}
  .logo{height:40px;padding:0 14px}
  .acc{padding:16px}
  .post{padding:14px;border-radius:20px}
  .strip button{flex-basis:78%}
  .nav-btn:not(.lb .nav-btn){display:none}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:6px 16px 2px}
  .filters::-webkit-scrollbar{display:none}
}
</style>
</head>

, "share": 6, "save": 6, "comment": 6, "follow": 5, "facts": 6, "images": 5}, "fixes": [], "fixed": [], "credits": 2.0, "updated": "2026-11-04T00:56:09", "permalink": "", "result": {}, "cmd": "python agent.py approve posts/americanfootballfights/1103_what-men-notice"}, {"id": "1104_body-evolution-leftovers", "account": "rocksfalls", "status": "approved", "score": 6, "type": "spreader", "headline": "IN ONE STUDY, 14% LACK THIS TENDON. DO YOU?", "slides": ["p/rocksfalls__1104_body-evolution-leftovers/00.jpg", "p/rocksfalls__1104_body-evolution-leftovers/01.jpg", "p/rocksfalls__1104_body-evolution-leftovers/02.jpg", "p/rocksfalls__1104_body-evolution-leftovers/03.jpg", "p/rocksfalls__1104_body-evolution-leftovers/04.jpg", "p/rocksfalls__1104_body-evolution-leftovers/05.jpg", "p/rocksfalls__1104_body-evolution-leftovers/06.jpg", "p/rocksfalls__1104_body-evolution-leftovers/07.jpg"], "titles": ["Stop. Do this with your hand", "That cord? The palmaris longus", "Your ear may have Darwin's tubercle", "Wisdom teeth are disappearing", "Your calf hides a useless muscle", "Babies have a grasp reflex", "Send this + follow for Part 2"], "caption": "You might be missing a tendon—try the wrist test now.\nThumb to pinky, wrist up. No cord? In one study, about 14% of people were born without it; rates vary by population.\nEar top rim: feel a point? In one study, about 1 in 10 people had Darwin's tubercle; rates vary.\nWisdom teeth: about 23% of people worldwide never develop them, according to one review.\nCalf: the plantaris does almost nothing; some people are born without it and never notice.\nHow many do you have? Comment your score.\nSend this to a friend who loves body facts.\nFollow → @rocksfalls — Part 2 tomorrow: the leftover in your eye.", "sources": ["https://www.jocmr.org/index.php/JOCMR/article/view/2243/1257", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4906103/", "https://medicover-genetics.com/news/wisdom-teeth-and-genetics-why-some-people-do-not-have-wisdom-teeth", "ht o train balance.\n\nSend today’s test to the friend who still claims he’s 25.\n\nFollow → @americanfootballfights — Part 2 tomorrow: the 10-second grip test", "sources": ["https://bjsm.bmj.com/content/56/17/975", "https://www.bristol.ac.uk/news/2022/june/tne-second-one-legged-stance.html", "https://newsnetwork.mayoclinic.org/discussion/mayo-clinic-minute-what-standing-on-one-leg-can-tell-you-about-how-well-youre-aging/", "https://geriatrictoolkit.missouri.edu/balance/Normative_Values_for_the_Unipedal_Stance_Test_Springer-JGPT.pdf"], "parts": {"stop": 5, "share": 6, "save": 6, "comment": 6, "follow": 4, "facts": 8, "images": 4}, "fixes": [], "fixed": [], "credits": 0, "updated": "2026-11-04T00:52:15", "permalink": "", "result": {}, "cmd": "python agent.py approve posts/americanfootballfights/1103_day-1-7-what-fighters-bodies-know-the-10"}, {"id": "1103_kissing-science", "account": "rocksfalls", "status": "rendered", "score": 6, "type": "spreader", "headline": "WHAT ONE 10-SECOND KISS REALLY DOES TO YOU", "slides": ["p/rocksfalls__1103_kissing-science/00.jpg", "p/rocksfalls__1103_kissing-science/01.jpg", "p/rocksfalls__1103_kissing-science/02.jpg", "p/rocksfalls__1103_kissing-science/03.jpg", "p/rocksfalls__1103_kissing-science/04.jpg", "p/rocksfalls__1103_kissing-science/05.jpg", "p/rocksfalls__1103_kissing-science/06.jpg", "p/rocksfalls__1103_kissing-science/07.jpg"], "titles": ["You just swapped 80 million bacteria", "Your mouths start to match", "Kiss more, stress less", "What ten seconds can do", "Part 2: the 20-second hug", "Save this, then comment", "Send this, then follow"], "caption": "Your last 10-second kiss moved about 80 million bacteria — and you didn’t feel a thing.\n\nIn a Dutch study, 2013, one 10-second intimate kiss was estimated to move about 80 million bacteria. In one 6-week University of Arizona trial, couples told to kiss more reported less stress and lower total cholesterol.\n\nSave this for your next kiss — or send it to the person who owes y -physi/07.jpg", "p/rocksfalls__1103_why-men-shut-down-under-stress-the-physi/08.jpg"], "titles": ["The shutdown starts at 100 BPM", "85% of stonewallers were men", "Men flood faster, recover slower", "Angry faces switch you off", "You have less oxytocin under stress", "You rehearse it and stay flooded", "You need 20 minutes, not 20 seconds", "Send this to the silent man"], "caption": "He goes quiet at the worst possible moment — and it's not because he stopped caring.\n\nPast about 100 beats per minute the brain stops processing what the other person is saying. Gottman's lab found 85% of the silent partners in conflict were men, flooding faster and recovering slower than women. That's physiology, not character.\n\nThe fix isn't talking harder. It's a real 20-minute break, because the body needs that long to come back to baseline.\n\nDo you shut down or talk it out under pressure? Be honest in the comments.\n\nFollow → @rocksfalls to get the most useful information first, every day.", "sources": ["https://www.gottman.com/blog/self-care-stonewalling-part-ii-the-research/", "https://www.gottman.com/blog/weekend-homework-assignment-physiological-self-soothing/", "https://today.usc.edu/why-we-fight-men-check-out-in-stressful-situations/", "https://taylorlab.psych.ucla.edu/wp-content/uploads/sites/5/2014/10/2000_Biobehavioral-responses-to-stress-in-females_tend-and-befriend.pdf"], "parts": {"stop": 7, "share": 8, "save": 6, "comment": 5, "follow": 4, "facts": 5, "images": 5}, "fixes": [], "fixed": [], "credits": 0, "updated": "2026-11-04T00:02:47", "permalink": "", "result": {}, "cmd": "python agent.py approve posts/rocksfalls/1103_why-men-shut-down-under-stress-the-physi"}, {"id": "1104_your-breath-reveals-your-stress-reserve", "account": "rocksfalls", "status": "rendered", "score": 6, "type": "spreader", "headline": "20-SECOND EXHALE TEST: MEN OVER 35 FAIL IT WITHOUT KNOWING", "slides": ["p/rocksfalls__1104_your-breath-reveals-your-stress-reserve/00.jpg", "p/rocksfalls__1104_your-breath-reveals-your-stress-reserve/01.jpg", "p/rocksfalls__1104_your-breath-reveals-your-stress-reserve/02.jpg", "p/rocksfalls__1104_your-breath-reveals-your-stress-reserve/03.jpg", "p/rocksfalls__1104_your-breath-reveals-your-stress-reserve/04.jpg", "p/rocksfalls__1104_your-breath-reveals-your-stress-reserve/05.jpg", "p/rocksfalls__1104_your-breath-reveals-your-stress-reserve/06.jpg"], "titles": ["Do this test right now", "20 seconds or less = warning", "Your exhale is your brake", "Why it dies after 35", "5 minutes flips your mood", "Send this to a guy who sighs"], "caption": "Your exhale is the cheapest stress test you'll ever run — and most men over 35 fail it before their first coffee.\n\nSit down. Nose in for 3 seconds, then exhale as slowly as you can. Under 20 seconds means your CO2 tolerance — your stress reserve — is tapped.\n\nExhaling is the only part of breathing you control, and it's the volume knob on your nervous system. Day 1 was grip. Today is breath. Tomorrow, eyes.\n\nDrop your number in the comments — how many seconds did you get?\n\nFollow → @rocksfalls to get the most useful information first, every day.", "sources": ["https://www.hubermanlab.com/episode/how-to-breathe-correctly-for-optimal-health-mood-learning-and-performance", "https://buteykoclinic.com/blogs/news/how-test-your-breathing-breath-hold-control-pause", "https://www.lung.org/lung-health-diseases/how-lungs-work/lung-capacity-and-aging", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7011578/", "https://academic.oup.com/ajrccm/article-abstract/152/2/677/8553780", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5709795/", "https://onlinelibrary.wiley.com/doi/full/10.1111/psyp.13905", "https://www.medscape.com/viewarticle/987805"], "parts": {"stop": 8, "share": 7, "save": 6, "comment": 6, "follow": 6, "facts": 5, "images": 5}, "fixes": [], "fixed": [], "credits": 0, "updated": "2026-11-04T00:52:08", "permalink": "", "result": {}, "cmd": "python agent.py approve posts/rocksfalls/1104_your-breath-reveals-your-stress-reserve"}, {"id": "1103_the-10-minute-walk-that-helps-fighters-r", "account": "americanfootballfights", "status": "rendered", "score": 5, "type": "spreader", "headline": "WALK 10 MINUTES AFTER SPARRING TO LOWER LACTATE", "slides": ["p/americanfootballfights__1103_the-10-minute-walk-that-helps-fighters-r/00.jpg", "p/americanfootballfights__1103_the-10-minute-walk-that-helps-fighters-r/01.jpg", "p/americanfootballfights__1103_the-10-minute-walk-that-helps-fighters-r/02.jpg", "p/americanfootballfights__1103_the-10-minute-walk-that-helps-fighters-r/03.jpg", "p/americanfootballfights__1103_the-10-minute-walk-that-helps-fighters-r/04.jpg", "p/americanfootballfights__1103_the-10-minute-walk-that-helps-fighters-r/05.jpg", "p/americanfootballfights__1103_the-10-minute-walk-that-helps-fighters-r/06.jpg", "p/americanfootballfights__1103_the-10-minute-walk-that-helps-fighters-r/07.jpg"], "titles": ["LACTATE PEAKS AFTER YOU STOP", "10 MINUTES BEATS SITTING", "THE WALK IS A PUMP", "TOO FAST BREAKS IT", "THE TALK TEST RULE", "THIS STUDY ONLY MEASURED LACTATE", "SEND THIS TO YOUR PARTNER"], "caption": "You finish sparring, you sit on the bench, and you let lactate peak while you rest.\n\nIn 18 kickboxers, blood lactate peaked 3 minutes after the final round, not during it. Same study: 10 minutes of easy walking left lactate at 8.94 mmol/L versus 10.98 for fighters who just sat.\n\nRule: walk at a pace where you can still say a full sentence without gasping. That's it.\n\nDo you walk it out after sparring, or collapse on the bench? Be honest 👇\n\nFollow → @americanfootballfights — Part 2 tomorrow: what to eat after sparring.", "sources": ["https://brieflands.com/journals/asjsm/articles/76676", "https://pubmed.ncbi.nlm.nih.gov/24739289/", "https://www.tandfonline.com/doi/full/10.1080/02640414.2010.481721"], "parts": {"stop": 4, "share": 5, "save": 5, "comment": 6, "follow": 3, "facts": 6, "images": 4}, "fixes": [], "fixed": [], "credits": 0, "updated": ts In 14 Zones", "One Desert, Eleven Countries", "The Amazon Ignores Every Nation", "Africa Feeds South America", "The Biggest Forest Has No Flag", "Send This To A Geography Friend"], "caption": "Your passport says one country. The ground under your feet belongs to an ecosystem that has never heard of it.\n\nErase every border and the planet reorganizes itself into 867 terrestrial ecoregions, 14 biomes, one continuous machine. A dust cloud from Africa is quietly feeding a rainforest in South America. No visa required.\n\nCan you guess how many countries the Amazon touches before slide 4? Screenshot slide 5 if Africa feeding the Amazon broke your brain.\n\nWhich fact broke your brain — the 11-country desert or Africa feeding the Amazon?\n\nFollow → @rocksfalls — Part 2 tomorrow: one biome at a time.", "sources": ["https://en.wikipedia.org/wiki/List_of_terrestrial_ecoregions_(WWF)", "https://www.britannica.com/place/Sahara-desert-Africa", "https://www.nature.org/en-us/get-involved/how-to-help/places-we-protect/amazon-rainforest/", "https://svs.gsfc.nasa.gov/11775/", "https://www.britannica.com/science/taiga"], "parts": {"stop": 3, "share": 5, "save": 5, "comment": 4, "follow": 3, "facts": 8, "images": 3}, "fixes": [], "fixed": [], "credits": 0, "updated": "2026-11-03T23:51:29", "permalink": "", "result": {}, "cmd": "python agent.py approve posts/rocksfalls/1103_if-you-erase-all-borders-this-is-what-th"}, {"id": "1103_why-training-6-days-a-week-breaks-footba", "account": "americanfootballfights", "status": "rendered", "score": 4, "type": "spreader", "headline": "TRAIN 6 DAYS? TEST YOUR RECOVERY BEFORE SET 1", "slides": ["p/americanfootballfights__1103_why-training-6-days-a-week-breaks-footba/00.jpg", "p/americanfootballfights__1103_why-training-6-days-a-week-breaks-footba/01.jpg", "p/americanfootballfights__1103_why-training-6-days-a-week-breaks-footba/02.jpg", "p/americanfootballfights__1103_why-training-6-days-a-week-breaks-footba/03.jpg", "p/americanfootballfights__   if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 40) { lbJ += dx < 0 ? 1 : -1; showLb(); }
});

render();
</script>
</body>
</html>
