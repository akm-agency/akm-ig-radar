   Ключ после верного пинкода хранится в браузере (localStorage + cookie на год), пинкод запоминает менеджер паролей. */
(() => {
const SALT = "akm-ig-radar-v1", ITER = 150000, CHECK = "a48e70ac1f6407cbb092d17883153692", NAME = "akm_k";
const enc = s => new TextEncoder().encode(s);
const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));

function sha256(msg) {   // синхронный SHA-256: ключевой поток — тысячи коротких хешей, WebCrypto для этого слишком медленный
  const l = msg.length, nb = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(nb);
  m.set(msg); m[l] = 0x80; const bits = l * 8;

  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a, h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;

    for (let i = 0; i < 64; i++) {

      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10)), mj = (a & b) ^ (a & c) ^ (b & c);

      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;

    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;

  try { const v = localStorage.getItem(NAME); if (v) return unhex(v); } catch { /* приватный режим */ }
  const c = document.cookie.split("; ").find(x => x.startsWith(NAME + "="));
  return c ? unhex(c.slice(NAME.length + 1)) : null;

  try { localStorage.setItem(NAME, hex(k)); } catch { /* без localStorage — останется cookie */ }

  #akmGate.shake form{animation:akmShake .4s}@keyframes akmShake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}`;
  const g = document.createElement("div"); g.id = "akmGate";
  g.innerHTML = `<style>${css}</style><form method="post" action="#" autocomplete="on">
    <div class="lg">AKM<span>.</span></div><p>Статистика сетки — только для своих. Введите пинкод.</p>

function renderAccounts() {
  const all = items();

    ${rows.map(r => `<div class="tr"><button class="nm" data-pick="${esc(r.a.name)}">${r.a.avatar ? `<img src="${r.a.avatar}" alt="">` : ""}<span>@${esc(r.a.name)}</span></button>
      <span>${z(r.gen)}</span><span>${z(r.wait)}</span><span>${z(r.qu)}</span><span>${z(r.free)}</span><span>${r.best == null ? '<span class="num0">—</span>' : pw({score: r.best})}</span>
      <span>${fmt(r.a.med_reach_10)}</span><span>${r.a.followers_7d > 0 ? "+" : ""}${fmt(r.a.followers_7d)}</span>

/* ---------- решения ---------- */
async function decide(p, decision, comment, extra) {

}
const dlg = $("dlg"), pdlg = $("pdlg");
dlg.addEventListener("close", () => render()); pdlg.addEventListener("close", () => render());
const xbtn = `<button class="dlg-x" data-close aria-label="Закрыть">×</button>`;

function strengthBlock(s, wdLabel) {
  if (!s) return `<div class="sdetail"><div class="bigstr"><b style="color:var(--faint)">—</b><span>сила слота: нет истории</span></div><p class="hint">У аккаунта слишком мало постов с замером. Слот можно занять, оценка появится после первых публикаций.</p></div>`;
  return `<div class="sdetail"><div class="bigstr"><b>${s.score}</b><span>${sWord(s)} слот</span></div>
    <p class="hint">Посты в это время${wdLabel ? " (" + wdLabel + " весит больше)" : ""} набирают в среднем <b>×${s.ratio.toFixed(1)}</b> к обычному: ожидаемый ${s.metric} ≈ <b>${fmt(s.expect)}</b> при медиане ${fmt(s.med)}.
    Опора: ${s.near} пост(ов) в пределах ±1,5 ч${s.nearMed ? ", их медиана " + fmt(s.nearMed) : ""}. Уверенность: <b>${s.conf}</b>.</p></div>`;
}
function openSlot(name, sk) {
  const m = slotModel(name), s = m.days.flatMap(d => d.slots).find(x => x.key === sk), day = m.days.find(d => d.slots.includes(s)); if (!s) return;
  const head = xbtn + `<h2>@${esc(name)} · ${when(sk)} МСК</h2>`, st = strengthBlock(s.str, day.wd);
  if (s.p) {
    const p = s.p;
    dlg.innerHTML = head + `<p class="state">${SC[s.st]}${pending(p) ? " (решение ждёт применения конвейером)" : ""}</p>${st}<div class="list" style="margin:10px 0">${rowBtn(p, "")}</div>
      <div class="btns">${p.permalink ? `<a class="btn" href="${esc(p.permalink)}" target="_blank" rel="noopener">Пост в Instagram</a>` : ""}
      ${p.status !== "published" ? `<button class="btn off" data-unslot="${esc(p.key)}" ${db ? "" : "disabled"}>Снять со слота</button>` : ""}</div>${p.status !== "published" ? needDb() : ""}`;
  } else {
    const cands = D.posts.filter(p => p.account === name && ["wait", "low"].includes(bucket(p)))
      .sort((x, y) => (bucket(x) === "wait" ? 0 : 1) - (bucket(y) === "wait" ? 0 : 1) || (y.critic?.score || 0) - (x.critic?.score || 0));

        <button class="btn approve sm" data-put="${esc(p.key)}" data-slot="${sk}" ${db ? "" : "disabled"}>Сюда</button></div>`).join("") : `<p class="state">Нет постов для этого аккаунта. Нужна новая партия.</p>`}</div>`;

/* добавить / убрать окно публикации */
async function saveWindows(name, wins) {
  const a = accByName[name], c = cfgOf(a), d = wins.length - c.windows.length;
  await store.put("slotcfg", name, {windows: wins, per_day: Math.max(1, c.per_day + d), max_per_day: Math.max(1, c.max_per_day + d), by: me, at: new Date().toISOString()});
}
function openAdd(name, hour) {
  const a = accByName[name], c = cfgOf(a), have = new Set(c.windows.map(wStart));
  if (hour == null) { // сильнейший свободный час по умолчанию
    let best = -1, bh = 12; for (let h = 0; h < 24; h++) { const s = strength(name, h, null); if (!have.has(h) && (s ? s.score : 30) > best) { best = s ? s.score : 30; bh = h; } } hour = bh;
  }
  const s = strength(name, hour, null);
  dlg.innerHTML = xbtn + `<h2>Слоты @${esc(name)}</h2><p class="state">Выберите час на графике: высота — сила слота по истории аккаунта. Новый слот появится на сетке сразу, в расписание конвейера попадёт при синхронизации.</p>
    <div style="margin:12px 0 4px" id="addChart">${hoursChart(name, hour)}</div>
    <div id="addInfo"><h2 style="margin-top:14px">Слот ${pad(hour)}:05 МСК</h2>${strengthBlock(s)}</div>
    <div class="btns"><button class="btn approve" id="addGo" ${db && !have.has(hour) ? "" : "disabled"}>${have.has(hour) ? "Слот в этот час уже есть" : "Добавить слот " + pad(hour) + ":05"}</button></div>${needDb()}
    <h2 style="margin-top:18px;font-size:15px">Текущие окна</h2><div class="wchips" style="margin-top:8px">${[...c.windows].sort((x, y) => wStart(x) - wStart(y)).map(w => `<span class="wchip"><b>${pad(wStart(w))}:05</b>${pw(strength(name, wStart(w), null))}<button data-rmw="${w}" aria-label="Убрать окно ${w}" title="Убрать окно" style="font-size:15px;color:var(--down)" ${db && c.windows.length > 1 ? "" : "disabled"}>×</button></span>`).join("")}</div>
    ${c.pending ? `<p class="note" style="margin-top:8px">Изменения окон ждут применения конвейером.</p>` : ""}`;

dlg.addEventListener("click", async e => {

/* ---------- карточка поста (окно) ---------- */
function card(p) {
  const c = p.critic || {}, pr = c.parts || {}, dcs = decisions[p.key], b = bucket(p), pend = pending(p), i = p._i;
  const pill = {wait: ["wait", "ждёт проверки"], ok: ["ok", "одобрен"], redo: ["redo", "на доработке"], pub: ["pub", "опубликован"], low: ["", "черновик"], off: ["", "снят"]}[b];
  const who = dcs ? `${names[dcs.by] || "редактор"} · ${new Date(dcs.at).toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})}` : "";
  const res = p.result ? `<div class="kv"><dt>Итог 24 ч</dt><dd>охват ${fmt(p.result.reach)} (×${p.result.x_reach} медианы), репосты ${p.result.shares_per_1k}/1000, подписки ${p.result.follows_per_1k}/1000 — ${esc(p.result.verdict)}</dd></div>` : "";
  const ed = edits[p.key], capText = ed?.caption ?? p.caption, capPend = ed && ed.caption !== p.caption;
  const slotKey = (pend && dcs.decision === "approved" && dcs.slot) ? dcs.slot : p.slot;
  const slotStr = slotKey && strength(p.account, +slotKey.slice(11, 13), wdOf(slotKey.slice(0, 10)));
  const slotTxt = slotKey ? when(slotKey) + " МСК" + (pend && dcs.slot ? " (ждёт синхронизации)" : "") : "назначится после одобрения";
  const free = p.status === "published" ? [] : freeSlots(p.account);
  const strongest = free.reduce((x, s) => !x || (s.str?.score ?? -1) > (x.str?.score ?? -1) ? s : x, null);
  const DL = {approved: "одобрен", rework: "на доработку", reject: "снят", unapprove: "одобрение отменено"};
  return `<article class="post" data-key="${esc(p.key)}">
  <div class="top">${pill[0] ? `<span class="pill ${pill[0]}">${pill[1]}</span>` : `<span class="pill">${pill[1]}</span>`}<span class="ac">${avatarOf(p.account) ? `<img src="${avatarOf(p.account)}" alt="">` : ""}<span>@${esc(p.account)}</span></span>
    <span class="hint">${FMT[p.format] ? FMT[p.format] + (p.series_day ? " " + p.series_day + "/7" : "") : (TYPE[p.type] || esc(p.type || ""))}</span>${p.collab ? `<span class="pill">совместно с @${esc(p.collab)}</span>` : ""}
    <span class="pscore">${c.score ?? "—"}<small>/10</small></span></div>
  <h3>${esc(p.headline)}</h3>
  <div class="strip">${p.slides.map((s, j) => `<button data-j="${j}" aria-label="Слайд ${j + 1}"><img data-enc="${s}" alt=""></button>`).join("")}</div>
  <div class="parts">${PARTS.filter(([ks]) => partVal(pr, ks) != null).map(([ks, l]) => { const v = partVal(pr, ks); return `<div class="part ${v >= 8 ? "hi" : v <= 5 ? "lo" : ""}"><small>${l}</small><b>${v}</b></div>`; }).join("")}</div>
  <div class="why"><h4>Почему этот пост</h4><p>${esc(c.why_viral || p.why || "—")}</p>
    <dl class="kv"><dt>Тема</dt><dd>${esc(p.topic)}</dd>${p.source ? `<dt>Источник</dt><dd>${esc(p.source)}</dd>` : ""}${p.keyword ? `<dt>Слово</dt><dd>${esc(p.keyword)} → в личку уходит список</dd>` : ""}<dt>Сильное</dt><dd>${esc(c.best || "—")}</dd><dt>Слабое</dt><dd>${esc(c.worst || "—")}</dd>
    <dt>Прогноз</dt><dd>${esc(c.predicted_reach || "—")}</dd><dt>Слот</dt><dd>${esc(slotTxt)} ${slotStr ? pw(slotStr) : ""}</dd><dt>Стоимость</dt><dd>${p.cost != null ? p.cost + " ₽" : "—"}</dd></dl>${res}</div>
  <details class="more"><summary>Подпись и источники${capPend ? " · правка ждёт применения" : ""}</summary>
    ${p.status === "published" ? `<div class="cap">${esc(p.caption)}</div>` : `<textarea id="cap-${i}" style="margin-top:8px;min-height:160px">${esc(capText)}</textarea>
    <div class="btns" style="margin-top:8px"><button class="btn sm" data-act="cap" ${db ? "" : "disabled"}>Сохранить подпись</button></div>`}
    <ul>${(p.sources || []).map(s => `<li><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a></li>`).join("")}</ul></details>
  ${(c.fixes || []).length ? `<details class="more"><summary>Замечания критика (${c.fixes.length})</summary><ul>${c.fixes.map(f => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}
  ${p.status === "published" ? (p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener">Пост в Instagram</a>` : "") : `

    <div class="btns"><button class="btn approve" data-act="approved" ${db ? "" : "disabled"}>${b === "ok" ? "Переставить" : "Одобрить"}</button>
      <button class="btn redo" data-act="rework" ${db ? "" : "disabled"}>На доработку</button>
      ${b === "ok" ? `<button class="btn" data-act="unapprove" ${db ? "" : "disabled"}>Отменить одобрение</button>` : ""}
      ${b !== "off" ? `<button class="btn off" data-act="reject" ${db ? "" : "disabled"}>Снять</button>` : `<button class="btn" data-act="unapprove" ${db ? "" : "disabled"}>Вернуть в проверку</button>`}</div>
    ${db ? "" : `<p class="note">Кнопки заработают после «Подключить запись» (токен GitHub, один раз на браузер).</p>`}
  </div>`}
  </article>`;
}
function openPost(key) {

    pdlg.innerHTML = xbtn + `<h2>${esc(b.headline)}</h2><p class="state">@${esc(b.account)} · ${STAGES.find(s => s[0] === BSTAGE[b.status])?.[2] || b.status} · обновлено ${ago(b.updated)} назад${b.live ? " · идёт сейчас" : ""}</p><p class="hint" style="margin-top:8px">Пост ещё делается: карточка с картинками и оценкой появится, когда конвейер дойдёт до проверки.</p>`;

pdlg.addEventListener("click", async e => {

});

let lp = null, lj = 0;
function openLb(p, j) { lp = p; lj = j; showLb(); $("lb").hidden = false; $("lbX").focus(); }
function showLb() { lj = (lj + lp.slides.length) % lp.slides.length; encUrl(lp.slides[lj]).then(u => { if (lp.slides[lj] && $("lbImg")) $("lbImg").src = u; }); $("lbC").textContent = `${lj + 1} / ${lp.slides.length} · @${lp.account}`; }
$("lbX").onclick = () => $("lb").hidden = true;
$("lbP").onclick = () => { lj--; showLb(); };
$("lbN").onclick = () => { lj++; showLb(); };
$("lb").addEventListener("click", e => { if (e.target.id === "lb") $("lb").hidden = true; });
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") $("lb").hidden = true;
  if (e.key === "ArrowLeft") { lj--; showLb(); }
  if (e.key === "ArrowRight") { lj++; showLb(); }
});

function hydrate() {
  const io = hydrate.io || (hydrate.io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; io.unobserve(e.target);
    encUrl(e.target.dataset.enc).then(u => { e.target.src = u; }).catch(() => { e.target.alt = "не загрузилось"; });
  }), {rootMargin: "800px"}));
  document.querySelectorAll("img[data-enc]:not([src])").forEach(i => io.observe(i));
}
function rerender() { if (dlg.open || pdlg.open) return; const a = document.activeElement; if (a && a.tagName === "TEXTAREA" && a.value) return; render(); }

/* ---------- хранилище решений: pulse/inbox/*.enc в репозитории (шифр пинкодом).
   Читать может любой вошедший; писать — тот, кто вставил токен GitHub (один репозиторий, право Contents).
   decisions — одобрения/правки/снятия, edits — подписи, slotcfg — окна публикации аккаунтов. ---------- */
const REPO = "akm-agency/akm-ig-radar", INBOX = "pulse/inbox/";
let token = ""; try { token = localStorage.getItem("akm-gh") || ""; } catch (e) {}
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0));
const gh = (path, opt = {}) => fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, {...opt, cache: "no-store",
  headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json", ...(opt.headers || {})}});
const store = {
  async read(name) {
    if (token) {
      const r = await gh(INBOX + name + ".enc");
      if (r.status === 404) return {map: {}, sha: null};
      if (!r.ok) throw new Error("GitHub " + r.status);
      const j = await r.json();
      return {map: JSON.parse(new TextDecoder().decode(await window.akmOpen(unb64(j.content)))), sha: j.sha};
    }
    const r = await fetch("inbox/" + name + ".enc?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return {map: {}, sha: null};
    return {map: JSON.parse(new TextDecoder().decode(await window.akmOpen(new Uint8Array(await r.arrayBuffer())))), sha: null};
  },
  async put(name, key, doc) {
    if (!token) throw new Error("нет токена");
    for (let n = 0; n < 4; n++) {
      const {map, sha} = await store.read(name);
      map[key] = doc;
      const body = {message: "Пульт: " + name + " " + key, content: b64(await window.akmSeal(new TextEncoder().encode(JSON.stringify(map))))};
      if (sha) body.sha = sha;
      const r = await gh(INBOX + name + ".enc", {method: "PUT", body: JSON.stringify(body)});
      if (r.ok) { ({decisions, edits, slotcfg}[name])[key] = doc; rerender(); return; }
      if (r.status !== 409 && r.status !== 422) throw new Error("GitHub " + r.status);   // конфликт — кто-то записал раньше, читаем заново
    }
    throw new Error("конфликт записи");
  },
};
async function refresh() {
  try {
    decisions = (await store.read("decisions")).map; edits = (await store.read("edits")).map; slotcfg = (await store.read("slotcfg")).map;
    Object.values(decisions).forEach(x => { if (x.by) names[x.by] = x.by; });
    rerender();
  } catch (e) { $("meta").textContent += " · не удалось обновить решения: " + e.message; }
}
function ghLabel() { $("gh").textContent = token ? "Запись включена" : "Подключить запись"; $("gh").classList.toggle("blue", !token); db = token ? store : null; }
$("gh").onclick = () => {
  dlg.dataset.add = "";
  dlg.innerHTML = xbtn + `<h2>Запись решений</h2>
    <p class="state" style="margin:6px 0 10px">Решения («Одобрить», «Снять», слот, подпись, окна публикации) сохраняются файлами в репозитории akm-ig-radar. Нужен токен GitHub: fine-grained, только репозиторий akm-ig-radar, право Contents: Read and write. Токен хранится только в этом браузере.</p>
    <input id="tk" type="password" autocomplete="off" placeholder="github_pat_…">
    <div class="btns" style="margin-top:10px"><button class="btn approve" id="tkOk">Сохранить</button>${token ? '<button class="btn off" id="tkDel">Отключить</button>' : ""}</div><p class="note" id="tkErr"></p>`;
  dlg.showModal();
  $("tkOk").onclick = async () => {
    const v = $("tk").value.trim(); if (!v) return;
    token = v; $("tkErr").textContent = "Проверяю…";
    try {
      const u = await fetch("https://api.github.com/user", {headers: {Authorization: "Bearer " + token}}).then(r => { if (!r.ok) throw new Error("токен не принят (" + r.status + ")"); return r.json(); });
      const t = await gh(INBOX.slice(0, -1));
      if (t.status === 401 || t.status === 403) throw new Error("у токена нет доступа к репозиторию");
      try { localStorage.setItem("akm-gh", token); } catch (e) {}
      me = u.login; names[me] = me; ghLabel(); dlg.close(); refresh();
    } catch (e) { token = ""; $("tkErr").textContent = e.message; }
  };
  if ($("tkDel")) $("tkDel").onclick = () => { try { localStorage.removeItem("akm-gh"); } catch (e) {} token = ""; me = null; ghLabel(); dlg.close(); };
};
$("out").onclick = () => window.akmLogout();

$("meta").textContent = `обновлено ${D.updated} · публикация только после «Одобрить» · окна: ${D.windows}`;
ghLabel();
render();
if (token) fetch("https://api.github.com/user", {headers: {Authorization: "Bearer " + token}}).then(r => r.ok ? r.json() : null).then(u => { if (u) { me = u.login; names[me] = me; } });
refresh();
setInterval(refresh, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}).catch(e => { document.body.insertAdjacentHTML("beforeend", '<p style="padding:24px;font:14px system-ui">Пульт не загрузился: ' + String(e.message || e).replace(/</g, "&lt;") + ". Обновите страницу.</p>"); });
</script>
</body></html>
