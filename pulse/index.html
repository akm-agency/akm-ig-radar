.num strong.lime{color:var(--lime)} .num strong.peach{color:var(--peach)}
.card{background:var(--tile);border-radius:var(--r);padding:16px}
.card>h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.card>h2 i{font-style:normal;background:var(--tile-2);border-radius:99px;padding:1px 8px;color:var(--ink);letter-spacing:0}
.week{display:grid;gap:6px}
.day{display:grid;grid-template-columns:52px 1fr;gap:8px}
.dl{font-size:12px;color:var(--muted);line-height:1.2;padding-top:8px}
.dl b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.day.today .dl b{color:var(--blue)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.slot{border-radius:14px;padding:8px;min-height:88px;display:flex;flex-direction:column;gap:5px;background:var(--tile-2);border:1.5px dashed var(--line);text-align:left;min-width:0;width:100%;color:var(--ink)}
.slot .t{font-family:var(--mono);font-size:12px;font-weight:500;display:flex;justify-content:space-between;gap:4px}
.slot .s{font-size:11.5px;color:var(--muted);line-height:1.25}
.slot.free{border-color:var(--up)} .slot.free .s{color:var(--up);font-weight:600}
.slot.booked,.slot.published,.slot.late{border:1.5px solid transparent;color:#0D0D0F}
.slot.booked{background:var(--lime)} .slot.published{background:var(--lav)} .slot.late{background:var(--peach)}
.slot.booked .s,.slot.booked .t,.slot.published .s,.slot.published .t,.slot.late .s,.slot.late .t{color:#0D0D0F}
.slot.missed{opacity:.5;cursor:default}
.slot .tt{font-size:11.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--tile-2);border-radius:14px;padding:8px;text-align:left;width:100%}
.row img,.row .ph{width:44px;height:55px;border-radius:8px;object-fit:cover;background:var(--line);display:block}
.row .ti{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .su{color:var(--muted);font-size:12px;margin-top:2px}
.row .sd{display:grid;gap:4px;justify-items:end}
.row b.sc{font-size:15px;font-weight:600}
.warnbox{background:var(--peach);color:#0D0D0F;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:500}
select{font:inherit;color:inherit;background:var(--tile-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;max-width:100%}
.btn.off{background:var(--tile-2);color:var(--down)}
dialog{border:0;border-radius:var(--r);padding:18px;background:var(--tile);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:86vh;overflow:auto}
dialog::backdrop{background:rgba(8,8,10,.6)}
dialog h2{font-size:17px;font-weight:600;margin-bottom:4px}
.dlg-x{float:right;font-size:24px;width:36px;height:36px;color:var(--muted)}
.pill.off{background:var(--tile-2);color:var(--down)}
@media (max-width:560px){.day{grid-template-columns:44px 1fr}.row{grid-template-columns:44px 1fr}.row .sd{grid-column:2;justify-items:start}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
[hidden]{display:none!important}
body{margin:0}
</style></head><body>

<div class="wrap">
  <header class="bar">
    <span class="logo">AKM</span>
    <div><h1>Пульт контентщика</h1><p class="meta" id="meta"></p></div>
    <div class="btns" style="margin-left:auto"><button class="btn" id="gh"></button><button class="btn" id="out">Выйти</button></div>
  </header>
  <section class="accs" id="accs"></section>
  <nav class="views" id="views" aria-label="Раздел"></nav>
  <section id="slotsView"><div class="sgrid" id="sgrid"></div></section>
  <section id="postsView">
    <details class="plan" id="plan"><summary>План реанимации каналов</summary><div class="plan-body" id="planBody"></div></details>
    <nav class="tabs" id="tabs" aria-label="Фильтр постов"></nav>
    <main class="grid" id="grid"></main>
  </section>
</div>
<dialog id="dlg"></dialog>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Слайды">
  <button class="x" id="lbX" aria-label="Закрыть">×</button>
  <button class="nv p" id="lbP" aria-label="Назад">‹</button><img id="lbImg" alt=""><button class="nv n" id="lbN" aria-label="Вперёд">›</button>
  <div class="c" id="lbC"></div>
</div>

<script>
window.akmKey.then(() => window.akmData('pulse')).then(async D => {
// части оценки критика: новый критик роста (04.11) — stop/spread/follow/fit/save/trust; у старых постов — share/comment/facts/images
const PARTS = [[["stop"],"обложка"],[["spread","share"],"переслать"],[["follow"],"подписка"],[["fit"],"аудитория"],[["save"],"сохранить"],[["trust","facts"],"факты"],[["comment"],"коммент"],[["images"],"картинки"]];
const partVal = (pr, keys) => { for (const k of keys) if (pr[k] != null) return pr[k]; return null; };
const TYPE = {spreader:"разгон", converter:"подписка"};
const FMT = {series:"серия, день", keyword:"слово в комментарии", hit:"хит конкурента"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString("ru-RU");
const byKey = Object.fromEntries(D.posts.map(p => [p.key, p]));
let decisions = {}, edits = {}, db = null, user = null, me = null, names = {}, tab = "wait", view = "slots";
try { tab = localStorage.getItem("akm-tab") || "wait"; view = localStorage.getItem("akm-view") || "slots"; } catch (e) {}
const saveLocal = () => { try { localStorage.setItem("akm-tab", tab); localStorage.setItem("akm-view", view); } catch (e) {} };
const nowMsk = () => new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 16).replace("T", " ");
const when = s => { const [d, t] = String(s || "").split(" "); return d ? d.slice(8) + "." + d.slice(5, 7) + " " + t : ""; };
const blobs = {};
function encUrl(path) {
  return blobs[path] || (blobs[path] = fetch(path, {cache: "force-cache"}).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
    .then(b => window.akmOpen(new Uint8Array(b))).then(u8 => URL.createObjectURL(new Blob([u8], {type: "image/jpeg"}))));
}
const flat = s => String(s || "").replace(/\n/g, " ");

$("meta").textContent = `обновлено ${D.updated} · публикация только после «Одобрить» · окна публикации ${D.windows}`;
$("accs").innerHTML = D.accounts.map(a => `<article class="dark"><div class="acc-hd">${a.avatar ? `<img src="${a.avatar}" alt="">` : ""}<b>@${esc(a.name)}</b></div>
  <div class="nums"><div class="num"><small>медиана охвата, 10 постов</small><strong>${fmt(a.med_reach_10)}</strong></div>
  <div class="num"><small>подписки с 10 постов</small><strong>${fmt(a.follows_10)}</strong></div>
  <div class="num"><small>подписчиков за 7 дней</small><strong>${a.followers_7d > 0 ? "+" : ""}${fmt(a.followers_7d)}</strong></div></div>
  <p class="goal">Цель недели: <b>${esc(a.goal)}</b></p></article>`).join("");
$("planBody").innerHTML = D.plan.map(s => `<div><h3>${esc(s.title)}</h3><ul>${s.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");

/* ---- корзины постов: решение редактора, ещё не применённое конвейером, важнее статуса на диске ---- */
function baseBucket(p) {
  if (p.status === "published") return "pub";
  if (p.status === "approved") return "ok";
  if (p.status === "rework") return "redo";
  if (p.status === "rejected") return "off";
  return p.status === "ready" ? "wait" : "low";
}
function bucket(p) {
  if (p.status === "published") return "pub";
  const d = decisions[p.key];
  if (d && p.decision_at !== d.at) return {approved: "ok", rework: "redo", unapprove: "wait", reject: "off"}[d.decision] || baseBucket(p);
  return baseBucket(p);
}
const pending = p => { const d = decisions[p.key]; return !!d && p.decision_at !== d.at; };

/* ---- слоты: сетка с диска + решения из БД (занял / освободил) ---- */
function slotModel(acc) {
  const A = D.slots.find(s => s.name === acc), occ = {};
  const now = nowMsk();
  A.days.forEach(d => d.slots.forEach(s => { if (s.pkey) occ[s.key] = s.pkey; }));
  const drop = k => { for (const sk in occ) if (occ[sk] === k) delete occ[sk]; };
  for (const [k, d] of Object.entries(decisions)) {
    const p = byKey[k]; if (!p || p.account !== acc || p.status === "published" || p.decision_at === d.at) continue;
    if (d.decision === "approved") { drop(k); if (d.slot) occ[d.slot] = k; }
    else if (["unapprove", "reject", "rework"].includes(d.decision)) drop(k);
  }
  const days = A.days.map(day => ({...day, slots: day.slots.map(s => {
    s = {...s, past: s.key < now};
    const pk = occ[s.key], p = pk && byKey[pk];
    let st = "free";
    if (p) st = p.status === "published" ? "published" : (s.past ? "late" : "booked");
    else if (s.past) st = "missed";
    return {...s, p, st};
  })}));
  const fut = days.flatMap(d => d.slots).filter(s => !s.past);
  return {A, days, free: fut.filter(s => s.st === "free"), booked: fut.filter(s => s.st === "booked").length, total: fut.length};
}
const freeSlots = acc => slotModel(acc).free;

const LABEL = {free: "Свободен", booked: "Одобрен", published: "Опубликован", late: "Просрочен", missed: "Пропущен"};
function slotBtn(acc, s) {
  const p = s.p;
  return `<button class="slot ${s.st}" data-acc="${esc(acc)}" data-sk="${s.key}" ${s.st === "missed" ? "disabled" : ""}>
    <span class="t"><span>${s.time}</span><span>МСК</span></span><span class="s">${LABEL[s.st]}${p && pending(p) ? " · ждёт синхр." : ""}</span>
    ${p ? `<span class="tt">${esc(flat(p.headline))}</span>` : ""}</button>`;
}
function rowBtn(p, extra) {
  const sc = p.critic?.score;
  return `<button class="row" data-goto="${esc(p.key)}">${p.slides[0] ? `<img data-enc="${p.slides[0]}" alt="">` : `<span class="ph"></span>`}
    <span><span class="ti">${esc(flat(p.headline))}</span><span class="su">${extra || ""}</span></span>
    <span class="sd">${sc != null ? `<b class="sc">${sc}<small style="color:var(--faint);font-weight:500">/10</small></b>` : ""}</span></button>`;
}
function listCard(title, arr, mk, empty) {
  return `<div class="card"><h2>${title}<i>${arr.length}</i></h2>${arr.length ? `<div class="list">${arr.map(mk).join("")}</div>` : `<p class="state">${empty}</p>`}</div>`;
}
function renderSlots() {
  $("sgrid").innerHTML = D.accounts.map(a => {
    const m = slotModel(a.name), mine = D.posts.filter(p => p.account === a.name);
    const sc = p => p.critic?.score || 0;
    const q = mine.filter(p => bucket(p) === "ok").sort((x, y) => (x.slot || "~").localeCompare(y.slot || "~"));
    const w = mine.filter(p => bucket(p) === "wait").sort((x, y) => sc(y) - sc(x));
    const dr = mine.filter(p => ["low", "redo"].includes(bucket(p))).sort((x, y) => sc(y) - sc(x));
    const pubs = mine.filter(p => p.status === "published");
    const warn = m.free.length && !q.length && !w.length ? `<div class="warnbox">Свободные слоты есть, а одобренных и готовых к одобрению постов нет: нужна новая партия.</div>`
      : (w.length && m.free.length ? `<div class="warnbox">${w.length} пост(ов) ждут одобрения, свободных слотов: ${m.free.length}. Нажмите на свободный слот, чтобы поставить пост.</div>` : "");
    return `<article class="sacc"><div class="dark"><div class="acc-hd">${a.avatar ? `<img src="${a.avatar}" alt="">` : ""}<b>@${esc(a.name)}</b></div>
      <div class="nums" style="grid-template-columns:repeat(4,1fr)"><div class="num"><small>свободных слотов, 7 дн.</small><strong class="lime">${m.free.length}</strong></div>
      <div class="num"><small>занято одобренными</small><strong>${m.booked}</strong></div>
      <div class="num"><small>ждут одобрения</small><strong class="${w.length ? "peach" : ""}">${w.length}</strong></div>
      <div class="num"><small>черновики</small><strong>${dr.length}</strong></div></div>
      <div class="fill"><span style="width:${m.total ? Math.round(100 * m.booked / m.total) : 0}%"></span></div>
      <p class="fillcap">${m.A.per_day} поста в день · окна ${m.A.windows.map(x => x + " МСК").join(", ")} · загружено ${m.booked} из ${m.total}</p></div>
      ${warn}
      <div class="card"><h2>Слоты · вчера и 7 дней вперёд</h2><div class="legend" style="margin-bottom:10px"><span><i style="background:var(--tile-2);border:1.5px solid var(--up)"></i>свободный</span><span><i style="background:var(--lime)"></i>одобрен</span><span><i style="background:var(--lav)"></i>опубликован</span><span><i style="background:var(--peach)"></i>просрочен</span></div>
        <div class="week">${m.days.map(d => `<div class="day${d.today ? " today" : ""}"><div class="dl"><b>${d.wd}</b>${d.label}</div><div class="slots">${d.slots.map(s => slotBtn(a.name, s)).join("")}</div></div>`).join("")}</div></div>
      ${listCard("Одобрены, в очереди", q, p => rowBtn(p, p.slot ? when(p.slot) : "слот назначится при синхронизации"), "Нет одобренных постов в очереди.")}
      ${listCard("Ждут одобрения", w, p => rowBtn(p, "готов к одобрению"), "Ничего не ждёт решения.")}
      ${listCard("Черновики и доработка", dr, p => rowBtn(p, bucket(p) === "redo" ? "на доработке" : "черновик"), "Черновиков нет.")}
      ${listCard("Опубликованы", pubs, p => rowBtn(p, when((p.published_at || "").replace("T", " ").slice(0, 16))), "Пока ничего не опубликовано.")}</article>`;
  }).join("");
}

/* ---- решения ---- */
async function decide(p, decision, comment, extra) {
  await store.put("decisions", p.key, {decision, comment: comment || "", by: me, at: new Date().toISOString(), headline: p.headline, ...(extra || {})});
}
const dlg = $("dlg");
dlg.addEventListener("close", () => render());
function openSlot(acc, sk) {
  const m = slotModel(acc), s = m.days.flatMap(d => d.slots).find(x => x.key === sk); if (!s) return;
  const head = `<button class="dlg-x" data-close aria-label="Закрыть">×</button><h2>@${esc(acc)} · ${when(sk)} МСК</h2>`;
  if (s.p) {
    const p = s.p;
    dlg.innerHTML = head + `<p class="state">${LABEL[s.st]}${pending(p) ? " (решение ждёт применения конвейером)" : ""}</p><div class="list" style="margin:10px 0">${rowBtn(p, "")}</div>
      <div class="btns">${p.permalink ? `<a class="btn" href="${esc(p.permalink)}" target="_blank" rel="noopener">Пост в Instagram</a>` : ""}
      <button class="btn" data-goto="${esc(p.key)}">Открыть карточку</button>
      ${p.status !== "published" ? `<button class="btn off" data-unslot="${esc(p.key)}" ${db ? "" : "disabled"}>Снять со слота</button>` : ""}</div>`;
  } else {
    const rank = p => bucket(p) === "wait" ? 0 : 1;
    const cands = D.posts.filter(p => p.account === acc && ["wait", "low"].includes(bucket(p)))
      .sort((x, y) => rank(x) - rank(y) || (y.critic?.score || 0) - (x.critic?.score || 0));
    dlg.innerHTML = head + `<p class="state">Выберите пост: он будет одобрен и поставлен в этот слот.${db ? "" : " Сначала нажмите «Подключить запись»."}</p>
      <div class="list" style="margin-top:10px">${cands.length ? cands.map(p => `<div class="row"><img data-enc="${p.slides[0]}" alt=""><span><span class="ti">${esc(flat(p.headline))}</span><span class="su">${bucket(p) === "wait" ? "готов" : "черновик, не прошёл критика"} · оценка ${p.critic?.score ?? "—"}</span></span>
        <span class="sd"><button class="btn approve" data-put="${esc(p.key)}" data-slot="${sk}" ${db ? "" : "disabled"}>Сюда</button></span></div>`).join("") : `<p class="state">Нет постов для этого аккаунта. Нужна новая партия.</p>`}</div>`;
  }
  dlg.showModal(); hydrate();
}
dlg.addEventListener("click", async e => {
  if (e.target === dlg || e.target.closest("[data-close]")) return dlg.close();
  const g = e.target.closest("[data-goto]"); if (g) { dlg.close(); return gotoPost(g.dataset.goto); }
  const put = e.target.closest("[data-put]");
  if (put && db) { put.disabled = true; put.textContent = "Сохраняю…";
    try { await decide(byKey[put.dataset.put], "approved", "", {slot: put.dataset.slot}); dlg.close(); } catch (err) { put.disabled = false; put.textContent = "Не вышло, ещё раз"; } }
  const un = e.target.closest("[data-unslot]");
  if (un && db) { un.disabled = true; un.textContent = "Сохраняю…";
    try { await decide(byKey[un.dataset.unslot], "unapprove", ""); dlg.close(); } catch (err) { un.disabled = false; un.textContent = "Не вышло, ещё раз"; } }
});
$("sgrid").addEventListener("click", e => {
  const s = e.target.closest(".slot"); if (s && !s.disabled) return openSlot(s.dataset.acc, s.dataset.sk);
  const g = e.target.closest("[data-goto]"); if (g) gotoPost(g.dataset.goto);
});
function gotoPost(key) {
  const p = byKey[key]; if (!p) return;
  view = "posts"; tab = bucket(p); saveLocal(); render();
  const i = shown.indexOf(p);
  requestAnimationFrame(() => { const el = document.querySelector(`.post[data-i="${i}"]`); if (el) el.scrollIntoView({block: "start", behavior: "smooth"}); });
}

/* ---- вкладки и карточки ---- */
const TABS = [["wait","Ждут проверки"],["ok","Одобрены"],["redo","На доработке"],["pub","Опубликованы"],["low","Черновики"],["off","Сняты"]];
function renderTabs() {
  const cnt = k => D.posts.filter(p => bucket(p) === k).length;
  $("tabs").innerHTML = TABS.map(([k, l]) => `<button class="tab" data-k="${k}" aria-pressed="${tab === k}">${l}<i>${cnt(k)}</i></button>`).join("");
  $("views").innerHTML = [["slots", "Слоты"], ["posts", "Посты"]].map(([k, l]) => `<button class="tab" data-v="${k}" aria-pressed="${view === k}">${l}</button>`).join("");
}
$("views").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; view = b.dataset.v; saveLocal(); render(); });
$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; tab = b.dataset.k; saveLocal(); render(); });

function card(p, i) {
  const c = p.critic || {}, pr = c.parts || {}, dcs = decisions[p.key], b = bucket(p), pend = pending(p);
  const pill = {wait:["wait","ждёт проверки"], ok:["ok","одобрен"], redo:["redo","на доработке"], pub:["pub","опубликован"], low:["low","черновик"], off:["off","снят"]}[b];
  const who = dcs ? `${names[dcs.by] || "редактор"} · ${new Date(dcs.at).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}` : "";
  const res = p.result ? `<div class="kv"><dt>Итог 24 ч</dt><dd>охват ${fmt(p.result.reach)} (×${p.result.x_reach} медианы), репосты ${p.result.shares_per_1k}/1000, подписки ${p.result.follows_per_1k}/1000 — ${esc(p.result.verdict)}</dd></div>` : "";
  const ed = edits[p.key], capText = ed?.caption ?? p.caption, capPend = ed && ed.caption !== p.caption;
  const slotTxt = (pend && dcs.decision === "approved" && dcs.slot) ? when(dcs.slot) + " (ждёт синхронизации)" : p.slot ? when(p.slot) : "назначится после одобрения";
  const free = p.status === "published" ? [] : freeSlots(p.account);
  const DL = {approved: "одобрен", rework: "на доработку", reject: "снят", unapprove: "одобрение отменено"};
  return `<article class="post" data-i="${i}">
  <div class="top"><span class="pill ${pill[0]}">${pill[1]}</span>
    <span class="who">${p.avatar ? `<img src="${p.avatar}" alt="">` : ""}@${esc(p.account)}</span>
    <span class="type">· ${FMT[p.format] ? FMT[p.format] + (p.series_day ? " " + p.series_day + "/7" : "") : (TYPE[p.type] || esc(p.type || ""))}</span>
    ${p.collab ? `<span class="pill">совместно с @${esc(p.collab)}</span>` : ""}
    <span class="score">${c.score ?? "—"}<small>/10</small></span></div>
  <h2>${esc(p.headline)}</h2>
  <div class="strip">${p.slides.map((s, j) => `<button data-j="${j}" aria-label="Слайд ${j + 1}"><img data-enc="${s}" alt=""></button>`).join("")}</div>
  <div class="parts">${PARTS.filter(([ks]) => partVal(pr, ks) != null).map(([ks, l]) => { const v = partVal(pr, ks); return `<div class="part ${v >= 8 ? "hi" : v <= 5 ? "lo" : ""}"><small>${l}</small><b>${v}</b></div>`; }).join("")}</div>
  <div class="why"><h3>Почему этот пост</h3><p>${esc(c.why_viral || p.why || "—")}</p>
    <dl class="kv"><dt>Тема</dt><dd>${esc(p.topic)}</dd>${p.source ? `<dt>Источник</dt><dd>${esc(p.source)}</dd>` : ""}${p.keyword ? `<dt>Слово</dt><dd>${esc(p.keyword)} → в личку уходит список (${(p.dm_text || "").split("\n").filter(Boolean).length} строк)</dd>` : ""}<dt>Сильное</dt><dd>${esc(c.best || "—")}</dd><dt>Слабое</dt><dd>${esc(c.worst || "—")}</dd>
    <dt>Прогноз</dt><dd>${esc(c.predicted_reach || "—")}</dd><dt>Слот</dt><dd>${esc(slotTxt)}</dd><dt>Стоимость</dt><dd>${p.cost != null ? p.cost + " ₽" : "—"}</dd></dl>${res}</div>
  <details class="more"><summary>Подпись и источники${capPend ? " · правка ждёт применения" : ""}</summary>
    ${p.status === "published" ? `<div class="cap">${esc(p.caption)}</div>` : `<textarea id="cap-${i}" style="margin-top:8px;min-height:160px">${esc(capText)}</textarea>
    <div class="btns" style="margin-top:8px"><button class="btn" data-act="cap" ${db ? "" : "disabled"}>Сохранить подпись</button></div>`}
    <ul>${(p.sources || []).map(s => `<li><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a></li>`).join("")}</ul></details>
  ${(c.fixes || []).length ? `<details class="more"><summary>Замечания критика (${c.fixes.length})</summary><ul>${c.fixes.map(f => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}
  ${p.status === "published" ? (p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener">Пост в Instagram</a>` : "") : `
  <div class="decide">
    ${dcs ? `<p class="state">Решение: <b>${DL[dcs.decision] || esc(dcs.decision)}</b>${pend ? "" : " (применено)"} · ${esc(who)}${dcs.comment ? `<br>«${esc(dcs.comment)}»` : ""}</p>` : ""}
    <label class="state" for="cm-${i}">Комментарий (для доработки обязателен)</label>
    <textarea id="cm-${i}" placeholder="Что поправить: слайд, текст, картинка…">${esc(pend ? dcs?.comment || "" : "")}</textarea>
    <label class="state" for="sl-${i}">Слот публикации</label>
    <select id="sl-${i}"><option value="">Ближайший свободный (авто)</option>${free.map(s => `<option value="${s.key}">${when(s.key)} МСК</option>`).join("")}</select>
    <div class="btns"><button class="btn approve" data-act="approved" ${db ? "" : "disabled"}>${b === "ok" ? "Переставить" : "Одобрить"}</button>
      <button class="btn redo" data-act="rework" ${db ? "" : "disabled"}>На доработку</button>
      ${b === "ok" ? `<button class="btn" data-act="unapprove" ${db ? "" : "disabled"}>Отменить одобрение</button>` : ""}
      ${b !== "off" ? `<button class="btn off" data-act="reject" ${db ? "" : "disabled"}>Снять</button>` : `<button class="btn" data-act="unapprove" ${db ? "" : "disabled"}>Вернуть в проверку</button>`}</div>
    ${db ? "" : `<p class="note">Кнопки заработают после «Подключить запись» (токен GitHub, один раз на браузер).</p>`}
  </div>`}
  </article>`;
}

let shown = [];
function render() {
  renderTabs();
  $("slotsView").hidden = view !== "slots"; $("postsView").hidden = view !== "posts";
  if (view === "slots") renderSlots();
  else {
    shown = D.posts.filter(p => bucket(p) === tab);
    $("grid").innerHTML = shown.length ? shown.map(card).join("") : `<div class="empty">${tab === "wait" ? "Новых постов на проверку нет. Сборщик добавляет их каждый день в 10:00 МСК." : "Здесь пока пусто."}</div>`;
  }
  hydrate();
}

$("grid").addEventListener("click", async e => {
  const art = e.target.closest(".post"); if (!art) return;
  const p = shown[+art.dataset.i];
  const sb = e.target.closest(".strip button");
  if (sb) return openLb(p, +sb.dataset.j);
  const btn = e.target.closest("[data-act]"); if (!btn || !db) return;
  const act = btn.dataset.act, i = art.dataset.i, label = btn.textContent;
  btn.disabled = true; btn.textContent = "Сохраняю…";
  try {
    if (act === "cap") {
      const text = art.querySelector("#cap-" + i).value.trim();
      await store.put("edits", p.key, {caption: text, by: me, at: new Date().toISOString(), headline: p.headline});
    } else {
      const ta = art.querySelector("#cm-" + i), comment = ta.value.trim();
      if (act === "rework" && !comment) { ta.focus(); ta.placeholder = "Напишите, что поправить: без комментария доработку не отправить"; btn.disabled = false; btn.textContent = label; return; }
      // «авто» = сразу первый свободный слот этого аккаунта (страница сама занимает его на сетке, не ждёт синхронизации)
      const slot = act === "approved" ? (art.querySelector("#sl-" + i).value || ((freeSlots(p.account)[0] || {}).key || "")) : "";
      await decide(p, act, comment, slot ? {slot} : {});
    }
  } catch (err) {
    btn.disabled = false; btn.textContent = "Не сохранилось, повторить";
  }
});

let lp = null, lj = 0;
function openLb(p, j) { lp = p; lj = j; showLb(); $("lb").hidden = false; $("lbX").focus(); }
function showLb() { lj = (lj + lp.slides.length) % lp.slides.length; encUrl(lp.slides[lj]).then(u => { if (lp.slides[lj] && $("lbImg")) $("lbImg").src = u; }); $("lbC").textContent = `${lj + 1} / ${lp.slides.length} · @${lp.account}`; }
$("lbX").onclick = () => $("lb").hidden = true;
$("lbP").onclick = () => { lj--; showLb(); };
$("lbN").onclick = () => { lj++; showLb(); };
$("lb").addEventListener("click", e => { if (e.target.id === "lb") $("lb").hidden = true; });
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") $("lb").hidden = true;
  if (e.key === "ArrowLeft") { lj--; showLb(); }
  if (e.key === "ArrowRight") { lj++; showLb(); }
});

function hydrate() {
  const io = hydrate.io || (hydrate.io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; io.unobserve(e.target);
    encUrl(e.target.dataset.enc).then(u => { e.target.src = u; }).catch(() => { e.target.alt = "не загрузилось"; });
  }), {rootMargin: "800px"}));
  document.querySelectorAll("img[data-enc]:not([src])").forEach(i => io.observe(i));
}
function rerender() { if (dlg.open) return; const a = document.activeElement; if (a && a.tagName === "TEXTAREA" && a.value) return; render(); }

/* ---- хранилище решений: pulse/inbox/decisions.enc и edits.enc в репозитории (шифр пинкодом).
   Читать может любой вошедший; писать — тот, кто вставил токен GitHub (доступ к одному репозиторию, право Contents). ---- */
const REPO = "akm-agency/akm-ig-radar", INBOX = "pulse/inbox/";
let token = ""; try { token = localStorage.getItem("akm-gh") || ""; } catch (e) {}
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0));
const gh = (path, opt = {}) => fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, {...opt, cache: "no-store",
  headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json", ...(opt.headers || {})}});
const store = {
  async read(name) {
    if (token) {
      const r = await gh(INBOX + name + ".enc");
      if (r.status === 404) return {map: {}, sha: null};
      if (!r.ok) throw new Error("GitHub " + r.status);
      const j = await r.json();
      return {map: JSON.parse(new TextDecoder().decode(await window.akmOpen(unb64(j.content)))), sha: j.sha};
    }
    const r = await fetch("inbox/" + name + ".enc?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return {map: {}, sha: null};
    return {map: JSON.parse(new TextDecoder().decode(await window.akmOpen(new Uint8Array(await r.arrayBuffer())))), sha: null};
  },
  async put(name, key, doc) {
    if (!token) throw new Error("нет токена");
    for (let n = 0; n < 4; n++) {
      const {map, sha} = await store.read(name);
      map[key] = doc;
      const body = {message: "Пульт: " + name + " " + key, content: b64(await window.akmSeal(new TextEncoder().encode(JSON.stringify(map))))};
      if (sha) body.sha = sha;
      const r = await gh(INBOX + name + ".enc", {method: "PUT", body: JSON.stringify(body)});
      if (r.ok) { (name === "decisions" ? decisions : edits)[key] = doc; rerender(); return; }
      if (r.status !== 409 && r.status !== 422) throw new Error("GitHub " + r.status);   // конфликт — кто-то записал раньше, читаем заново
    }
    throw new Error("конфликт записи");
  },
};
async function refresh() {
  try {
    decisions = (await store.read("decisions")).map; edits = (await store.read("edits")).map;
    Object.values(decisions).forEach(x => { if (x.by) names[x.by] = x.by; });
    rerender();
  } catch (e) { $("meta").textContent += " · не удалось обновить решения: " + e.message; }
}
function ghLabel() { $("gh").textContent = token ? "Запись включена" : "Подключить запись"; db = token ? store : null; }
$("gh").onclick = () => {
  dlg.innerHTML = `<button class="dlg-x" data-close aria-label="Закрыть">×</button><h2>Запись решений</h2>
    <p class="state" style="margin:6px 0 10px">Решения («Одобрить», «Снять», слот, подпись) сохраняются файлами в репозитории akm-ig-radar. Нужен токен GitHub: fine-grained, только репозиторий akm-ig-radar, право Contents: Read and write. Токен хранится только в этом браузере.</p>
    <input id="tk" type="password" autocomplete="off" placeholder="github_pat_…" style="width:100%;border-radius:12px;border:1px solid var(--line);background:var(--tile-2);color:inherit;padding:10px;font:inherit">
    <div class="btns" style="margin-top:10px"><button class="btn approve" id="tkOk">Сохранить</button>${token ? '<button class="btn off" id="tkDel">Отключить</button>' : ""}</div><p class="note" id="tkErr"></p>`;
  dlg.showModal();
  $("tkOk").onclick = async () => {
    const v = $("tk").value.trim(); if (!v) return;
    token = v; $("tkErr").textContent = "Проверяю…";
    try {
      const u = await fetch("https://api.github.com/user", {headers: {Authorization: "Bearer " + token}}).then(r => { if (!r.ok) throw new Error("токен не принят (" + r.status + ")"); return r.json(); });
      const t = await gh(INBOX.slice(0, -1));
      if (t.status === 401 || t.status === 403) throw new Error("у токена нет доступа к репозиторию");
      try { localStorage.setItem("akm-gh", token); } catch (e) {}
      me = u.login; names[me] = me; ghLabel(); dlg.close(); refresh();
    } catch (e) { token = ""; $("tkErr").textContent = e.message; }
  };
  if ($("tkDel")) $("tkDel").onclick = () => { try { localStorage.removeItem("akm-gh"); } catch (e) {} token = ""; me = null; ghLabel(); dlg.close(); };
};
$("out").onclick = () => window.akmLogout();

ghLabel();
render();
if (token) fetch("https://api.github.com/user", {headers: {Authorization: "Bearer " + token}}).then(r => r.ok ? r.json() : null).then(u => { if (u) { me = u.login; names[me] = me; } });
refresh();
setInterval(refresh, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}).catch(e => { document.body.insertAdjacentHTML("beforeend", '<p style="padding:24px;font:14px system-ui">Пульт не загрузился: ' + String(e.message || e).replace(/</g, "&lt;") + ". Обновите страницу.</p>"); });
</script>
</body></html>
