<script>
window.akmKey.then(() => window.akmData('pulse')).then(async D => {
const PARTS = [[["stop"],"обложка"],[["spread","share"],"переслать"],[["follow"],"подписка"],[["fit"],"аудитория"],[["save"],"сохранить"],[["trust","facts"],"факты"],[["comment"],"коммент"],[["images"],"картинки"]];
const partVal = (pr, keys) => { for (const k of keys) if (pr[k] != null) return pr[k]; return null; };
const TYPE = {spreader: "разгон", converter: "подписка"};
const FMT = {series: "серия, день", keyword: "слово в комментарии", hit: "хит конкурента"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString("ru-RU");
const pad = n => String(n).padStart(2, "0");
const flat = s => String(s || "").replace(/\n/g, " ");
const WD = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const WDF = ["понедельник", "вторник", "среда", "четверг", "пятница", "суббота", "воскресенье"];

D.posts.forEach((p, i) => p._i = i);
const byKey = Object.fromEntries(D.posts.map(p => [p.key, p]));
const accByName = Object.fromEntries(D.accounts.map(a => [a.name, a]));
const avatarOf = n => accByName[n]?.avatar || "";
let decisions = {}, edits = {}, slotcfg = {}, db = null, me = null, names = {};
let view = "flow", stg = "wait", acc = "", sortBy = "wait";
const pick = {}, confirmRm = {};
try { view = localStorage.getItem("akm-view2") || "flow"; stg = localStorage.getItem("akm-stg") || "wait"; acc = localStorage.getItem("akm-acc") || ""; } catch (e) {}
if (acc && !accByName[acc]) acc = "";
if (D.accounts.length === 1) acc = D.accounts[0].name;
const saveLocal = () => { try { localStorage.setItem("akm-view2", view); localStorage.setItem("akm-stg", stg); localStorage.setItem("akm-acc", acc); } catch (e) {} };
const nowMsk = () => new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 16).replace("T", " ");
const ts = iso => Date.parse(/(Z|[+-]\d\d:?\d\d)$/.test(iso) ? iso : iso + "+03:00");
const ago = iso => { if (!iso) return ""; const m = Math.round((Date.now() - ts(iso)) / 60000);
  return m < 1 ? "только что" : m < 60 ? m + " мин назад" : m < 1440 ? Math.round(m / 60) + " ч назад" : Math.round(m / 1440) + " дн назад"; };
const addDays = (d, n) => new Date(Date.parse(d + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);
const wdOf = d => (new Date(d + "T00:00:00Z").getUTCDay() + 6) % 7;
const slotLabel = key => { const d = key.slice(0, 10), t = key.slice(11, 16), today = nowMsk().slice(0, 10);
  const w = d === today ? "сегодня" : d === addDays(today, 1) ? "завтра" : WD[wdOf(d)] + " " + d.slice(8) + "." + d.slice(5, 7); return w + " " + t; };
let toastT;
function toast(msg, err) { const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200); }
const blobs = {};
function encUrl(path) {
  return blobs[path] || (blobs[path] = fetch(path, {cache: "force-cache"}).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
    .then(b => window.akmOpen(new Uint8Array(b))).then(u8 => URL.createObjectURL(new Blob([u8], {type: "image/jpeg"}))));
}

/* ---------- окна публикации: config.json + ещё не применённая правка со страницы (slotcfg) ---------- */
const wStart = w => +w.split("-")[0];
const sortW = ws => [...ws].sort((x, y) => wStart(x) - wStart(y));
function cfgOf(a) {
  const ov = slotcfg[a.name], use = !!ov && ov.at > (a.cfg_at || "");
  return {windows: sortW(use ? ov.windows : a.windows), per_day: use ? ov.per_day : a.per_day, max_per_day: use ? ov.max_per_day : a.max_per_day, pending: use, saved: sortW(a.windows)};
}

/* ---------- СИЛА СЛОТА ----------
   История публикаций аккаунта: охват каждого поста и время выхода по Москве. Для слота «час + день недели» — во сколько раз
   посты рядом по времени (гауссово окно ±1,25 ч; тот же день недели весит полностью, другие — 55 %) отличаются от медианы аккаунта,
   со сжатием к «как обычно» при малой выборке. 50 = как обычно, 88 ≈ ×2, 12 ≈ ×0,5. */
const HIST = {};
Object.entries(D.hist || {}).forEach(([a, h]) => {
  const v = h.p.map(x => x[1]).sort((x, y) => x - y);
  HIST[a] = {metric: h.metric, med: v.length ? v[v.length >> 1] : 0,
    pts: h.p.map(([t, val]) => ({h: +t.slice(11, 13) + +t.slice(14, 16) / 60, wd: wdOf(t.slice(0, 10)), v: val}))};
});
const SMEMO = {};
function strength(a, hour, wd) {
  const k = a + "|" + hour + "|" + wd; if (k in SMEMO) return SMEMO[k];
  const H = HIST[a]; let r = null;
  if (H && H.pts.length >= 3 && H.med > 0) {
    let num = 0, den = 0, near = 0; const nearV = [];
    for (const q of H.pts) {
      let dh = Math.abs(q.h - (hour + .5)); dh = Math.min(dh, 24 - dh);
      let w = Math.exp(-dh * dh / (2 * 1.25 * 1.25)); if (wd != null && q.wd !== wd) w *= .55;
      num += w * Math.log(Math.max(q.v, 1) / H.med); den += w;
      if (dh <= 1.5) { near++; nearV.push(q.v); }
    }
    const est = num / (den + 2);
    nearV.sort((x, y) => x - y);
    r = {score: Math.round(50 + 50 * Math.tanh(est / .7)), ratio: Math.exp(est), near, metric: H.metric, med: H.med, expect: Math.round(H.med * Math.exp(est)),
         conf: near >= 8 ? "высокая" : near >= 3 ? "средняя" : "низкая", nearMed: nearV.length ? nearV[nearV.length >> 1] : null};
  }
  return SMEMO[k] = r;
}
const sCls = s => !s ? "no" : s.score >= 68 ? "hi" : s.score >= 42 ? "mid" : "lo";
const sWord = s => !s ? "нет истории" : s.score >= 68 ? "сильный" : s.score >= 42 ? "средний" : "слабый";
const pw = (s, sm) => `<span class="pw ${sCls(s)} ${sm ? "sm" : ""}" title="${s ? "Сила слота " + s.score + " из 100: ×" + s.ratio.toFixed(1) + " к обычному охвату" : "Мало постов в истории"}"><u><i style="width:${s ? s.score : 0}%"></i></u>${s ? s.score : "—"}</span>`;
const xr = s => s ? "×" + s.ratio.toFixed(1).replace(".", ",") : "";

/* ---------- статусы постов (решение редактора, ещё не применённое конвейером, важнее статуса на диске) ---------- */
function baseBucket(p) {
  if (p.status === "published") return "pub";
  if (p.status === "approved") return "ok";
  if (p.status === "rework") return "redo";
  if (p.status === "rejected") return "off";
  return p.status === "ready" ? "wait" : "low";
}
function bucket(p) {
  if (p.status === "published") return "pub";
  const d = decisions[p.key];
  if (d && p.decision_at !== d.at) return {approved: "ok", rework: "redo", unapprove: "wait", reject: "off"}[d.decision] || baseBucket(p);
  return baseBucket(p);
}
const pending = p => { const d = decisions[p.key]; return !!d && p.decision_at !== d.at; };
function stageOf(p) {
  const b = bucket(p);
  if (b === "pub") return "pub"; if (b === "ok") return "queue"; if (b === "redo") return "edit"; if (b === "off") return "off"; if (b === "wait") return "wait";
  if (p.status === "imaged") return "img"; if (p.status === "draft") return "write";
  return p.critic?.score == null ? "check" : "fail";
}
const STAGES = [
  ["plan",  "ai",  "Тема выбрана",  "ждёт сборщика"],
  ["write", "ai",  "Пишется",       "текст и факты"],
  ["img",   "ai",  "Картинки",      "подбор кадров"],
  ["check", "ai",  "Оценка ИИ",     "критик ставит балл"],
  ["fail",  "ai",  "Слабый балл",   "ниже порога"],
  ["wait",  "you", "Ждут вас",      "одобрить или вернуть"],
  ["edit",  "you", "Правки",        "ИИ исправляет"],
  ["queue", "out", "Очередь",       "одобрены, ждут слота"],
  ["pub",   "out", "Вышли",         "в Instagram"],
];
const PHASE = {ai: ["ИИ готовит", "без вас"], you: ["Ваш ход", "решения редактора"], out: ["Выход", "по слотам"]};
const BSTAGE = {planned: "plan", draft: "write", imaged: "img"};
function items(all) {
  const A = acc && !all ? (x => x.account === acc) : () => true;
  const posts = D.posts.map(p => ({...p, stage: stageOf(p)}));
  const bld = (D.building || []).filter(b => !byKey[b.key]).map(b => ({...b, slides: [], critic: {}, building: true, stage: BSTAGE[b.status] || "plan"}));
  return [...posts, ...bld].filter(A);
}

/* ---------- слоты: календарь «вчера + 7 дней» по окнам аккаунта ---------- */
function slotModel(name) {
  const a = accByName[name], c = cfgOf(a), now = nowMsk(), today = now.slice(0, 10);
  const mine = D.posts.filter(p => p.account === name);
  const occ = {};
  mine.forEach(p => { if (p.slot && ["approved", "published"].includes(p.status)) occ[p.slot] = p.key; });
  const days = [];
  for (let n = -1; n <= 7; n++) { const date = addDays(today, n); days.push({date, wdi: wdOf(date), today: n === 0}); }
  // опубликованные без слота — в окно, где вышли
  mine.filter(p => p.status === "published" && p.published_at).forEach(q => {
    if (Object.values(occ).includes(q.key)) return;
    const d = q.published_at.slice(0, 10), h = +q.published_at.slice(11, 13), w = c.windows.find(w => { const [s, e] = w.split("-").map(Number); return h >= s && h < e; });
    if (w) occ[`${d} ${pad(wStart(w))}:05`] = q.key;
  });
  // решения, ещё не применённые конвейером
  const drop = k => { for (const sk in occ) if (occ[sk] === k) delete occ[sk]; };
  for (const [k, d] of Object.entries(decisions)) {
    const p = byKey[k]; if (!p || p.account !== name || p.status === "published" || p.decision_at === d.at) continue;
    if (d.decision === "approved") { drop(k); if (d.slot) occ[d.slot] = k; }
    else if (["unapprove", "reject", "rework"].includes(d.decision)) drop(k);
  }
  const rows = c.windows.map(w => ({win: w, hour: wStart(w), cells: days.map(day => {
    const key = `${day.date} ${pad(wStart(w))}:05`, past = key < now, p = occ[key] && byKey[occ[key]];
    const st = p ? (p.status === "published" ? "published" : (past ? "late" : "booked")) : (past ? "missed" : "free");
    return {key, past, p, st, str: strength(name, wStart(w), day.wdi), wdi: day.wdi};
  })}));
  const fut = rows.flatMap(r => r.cells).filter(s => !s.past).sort((x, y) => x.key.localeCompare(y.key));
  // занятые слоты вне окон (окно убрали, а пост уже стоит) — тоже показываем в очереди, но не в сетке
  return {a, c, days, rows, fut, free: fut.filter(s => s.st === "free"), booked: fut.filter(s => s.st === "booked").length, total: fut.length,
          pub7: rows.flatMap(r => r.cells).filter(s => s.st === "published").length};
}
const freeSlots = n => slotModel(n).free;
const bestFree = n => {   // самый сильный свободный слот в ближайшие 48 ч (иначе — ближайший)
  const f = freeSlots(n); if (!f.length) return null;
  const lim = new Date(Date.now() + (3 + 48) * 3600e3).toISOString().slice(0, 16).replace("T", " ");
  const near = f.filter(s => s.key <= lim);
  return (near.length ? near : f.slice(0, 1)).reduce((b, s) => (s.str?.score ?? 40) > (b.str?.score ?? 40) ? s : b);
};

/* ---------- ЖИВОЙ ЖУРНАЛ: pulse/live.enc в ветке pulse-live (live_watch.py, каждые 15 с) ----------
   procs — процессы конвейера с пульсом, events — последние действия, posts — последнее действие по каждому посту. */
let LIVE = null, liveErr = "", liveFeedAll = false;
const PN = {rework: "Доработка по правкам", builder: "Сборщик постов", cycle: "Цикл дня", factory: "Фабрика постов", publish: "Публикация",
  daily: "Статистика", early: "Ранние признаки", frames: "Кадры", fix_dark: "Починка чёрных слайдов", hf_bridge: "Chrome → Higgsfield", pulse_watch: "Наблюдатель пульта", live_watch: "Живой журнал", setup: "Настройка"};
const secAgo = iso => iso ? Math.max(0, Math.round((Date.now() - ts(iso)) / 1000)) : 1e9;
const agoS = iso => { const s = secAgo(iso); return s < 60 ? s + " с назад" : s < 3600 ? Math.round(s / 60) + " мин назад" : s < 86400 ? Math.round(s / 3600) + " ч назад" : Math.round(s / 86400) + " дн назад"; };
const hm = iso => iso ? iso.slice(11, 16) : "";
function procState(p) {
  if (!p.alive) return p.ended ? ["off", "закончил " + hm(p.ended)] : ["off", "остановлен"];
  const s = secAgo(p.at);
  return s < 75 ? ["on", "работает"] : ["stale", "пульса нет " + agoS(p.at).replace(" назад", "")];
}
const headOf = k => flat(byKey[k]?.headline || (D.building || []).find(b => b.key === k)?.headline || (k || "").split("__")[1] || "");
/* что с постом прямо сейчас: последнее действие и признак «застрял» */
function postLive(p) {
  if (!LIVE) return null;
  const last = LIVE.posts?.[p.key], rw = (LIVE.procs || []).find(x => x.name === "rework");
  const doing = (LIVE.procs || []).find(x => x.alive && (x.doing || []).some(d => d.key === p.key));
  if (p.stage === "edit" && p.rework_error && !pending(p)) {
    if (!p.rework_pending) return {cls: "stuck", t: "доработка упала после 3 попыток: " + p.rework_error.slice(0, 120) + " — отправьте «На доработку» ещё раз"};
    if (!doing) return {cls: "stuck", t: `сбой (попытка ${p.rework_tries || 1} из 3), повтор: ` + p.rework_error.slice(0, 90)};
  }
  if (p.stage === "edit") {
    if (!pending(p) && !doing && !(rw && rw.alive)) return {cls: "stuck", t: "доработка не идёт: процесс не запущен" + (last ? " · последнее: " + last.msg.slice(0, 80) + " (" + agoS(last.at) + ")" : "")};
    if (doing) return {cls: "go", t: "сейчас: " + ((doing.doing.find(d => d.key === p.key) || {}).msg || last?.msg || "в работе").slice(0, 110)};
    if (rw && rw.alive) return {cls: "", t: "в очереди доработки" + (last ? " · последнее: " + last.msg.slice(0, 70) + " (" + agoS(last.at) + ")" : "")};
  }
  if (doing) return {cls: "go", t: "сейчас: " + ((doing.doing.find(d => d.key === p.key) || {}).msg || "в работе").slice(0, 110)};
  if (last && secAgo(last.at) < 6 * 3600) return {cls: last.kind === "err" ? "stuck" : "", t: last.msg.slice(0, 110) + " · " + agoS(last.at)};
  return null;
}
function livePanel() {
  if (!LIVE) return `<section class="panel" id="livePanel"><div class="lhead"><h2>Сейчас в работе</h2><span class="lfresh ${liveErr ? "bad" : ""}">${liveErr ? "журнал не загрузился: " + esc(liveErr) : "загружаю журнал…"}</span></div></section>`;
  const fresh = secAgo(LIVE.at), stale = fresh > 180;
  const order = {on: 0, stale: 1, off: 2};
  const procs = [...(LIVE.procs || [])].filter(p => p.alive || secAgo(p.ended || p.at) < 12 * 3600).sort((x, y) => order[procState(x)[0]] - order[procState(y)[0]]);
  const ev = (LIVE.events || []).filter(e => liveFeedAll || e.key || e.kind === "stage" || e.kind === "err").filter(e => !acc || !e.key || e.key.startsWith(acc + "__")).slice(-60).reverse();
  const img = LIVE.img;
  return `<section class="panel" id="livePanel"><div class="lhead"><h2>Сейчас в работе</h2>
    <span class="lfresh ${stale ? "bad" : ""}">${stale ? "⚠ конвейер не выходит на связь " + agoS(LIVE.at) + " — проверьте, включён ли ПК и pulse_watch" : "журнал живой · обновлён " + agoS(LIVE.at)}</span>
    <span class="sp" style="margin-left:auto"><button class="chip" data-feedall aria-pressed="${liveFeedAll}">${liveFeedAll ? "Все строки" : "Только важное"}</button></span></div>

}

/* ---------- экран «Аккаунты» ---------- */
function renderAccounts() {
  const all = items(true);
  const rows = D.accounts.map(a => {
    const mine = all.filter(p => p.account === a.name), n = k => mine.filter(p => p.stage === k).length, m = slotModel(a.name);
    const gen = n("plan") + n("write") + n("img") + n("check"), wait = n("wait"), qu = n("queue");
    const bs = m.free.reduce((b, s) => Math.max(b, s.str?.score ?? -1), -1);
    return {a, gen, wait, qu, free: m.free.length, best: bs < 0 ? null : bs, reach: a.med_reach_10 ?? 0, fol: a.followers_7d ?? 0,
            flag: m.free.length && !wait && !qu ? "нужна партия" : wait ? "ждёт вас" : m.free.length === 0 ? "слоты заняты" : "в порядке"};
  });
  const SORTS = {name: (x, y) => x.a.name.localeCompare(y.a.name), gen: (x, y) => y.gen - x.gen, wait: (x, y) => y.wait - x.wait || y.free - x.free, qu: (x, y) => y.qu - x.qu,
    free: (x, y) => y.free - x.free, best: (x, y) => (y.best ?? -1) - (x.best ?? -1), reach: (x, y) => y.reach - x.reach, fol: (x, y) => y.fol - x.fol, flag: (x, y) => x.flag.localeCompare(y.flag)};
  rows.sort(SORTS[sortBy] || SORTS.wait);
  const th = (k, l) => `<button data-sort="${k}" ${sortBy === k ? 'aria-sort="descending"' : ""}>${l}</button>`;
  const z = v => v ? `<span class="num">${v}</span>` : `<span class="z">0</span>`;
  const bad = rows.filter(r => r.flag === "нужна партия").length;
  $("view").innerHTML = `<section><div class="ph" style="padding:0 6px"><h2>Аккаунты</h2><span class="n">${D.accounts.length}</span><span class="hint">${bad ? bad + " без запаса постов" : "у всех есть запас"} · строка открывает конвейер аккаунта</span></div>
    <div class="tbl"><div class="tr hd">${th("name", "Аккаунт")}${th("gen", "ИИ готовит")}${th("wait", "Ждут вас")}${th("qu", "Очередь")}${th("free", "Свободно")}${th("best", "Лучший слот")}${th("reach", "Охват, мед.")}${th("fol", "Подп. 7 дн.")}${th("flag", "Статус")}</div>
    ${rows.map(r => `<div class="tr" data-pick="${esc(r.a.name)}"><span class="nm">${r.a.avatar ? `<img src="${r.a.avatar}" alt="">` : ""}<span>@${esc(r.a.name)}</span></span>
      ${z(r.gen)}${z(r.wait)}${z(r.qu)}${z(r.free)}<span>${r.best == null ? '<span class="z">—</span>' : pw({score: r.best, ratio: 1}, 1)}</span>
      <span class="num">${fmt(r.a.med_reach_10)}</span><span class="num">${r.a.followers_7d > 0 ? "+" : ""}${fmt(r.a.followers_7d)}</span>
      <span><span class="flag ${r.flag === "нужна партия" ? "bad" : r.flag === "ждёт вас" ? "you" : ""}">${r.flag}</span></span></div>`).join("")}</div></section>`;
}

function render() {
  const w = items().filter(p => p.stage === "wait").length;
  const upN = D.posts.filter(p => p.manual && bucket(p) === "ok").length;
  $("nav").innerHTML = [["flow", "Конвейер", w], ["upload", "Заливка", upN], ["slots", "Слоты", 0], ["accs", "Аккаунты", 0]].map(([k, l, n]) =>
    `<button data-v="${k}" aria-pressed="${view === k}">${l}${n ? `<span class="badge">${n}</span>` : ""}</button>`).join("");
  $("accSel").innerHTML = `<option value="">Все аккаунты · ${D.accounts.length}</option>` + D.accounts.map(a => `<option value="${esc(a.name)}" ${acc === a.name ? "selected" : ""}>@${esc(a.name)}</option>`).join("");
  $("accSel").hidden = D.accounts.length < 2;

$("accSel").onchange = e => { acc = e.target.value; saveLocal(); render(); };
$("nav").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; view = b.dataset.v; saveLocal(); render(); window.scrollTo({top: 0}); });

/* ---------- действия на экранах ---------- */
async function saveWindows(name, wins) {
  const a = accByName[name], c = cfgOf(a), d = wins.length - c.windows.length;
  await store.put("slotcfg", name, {windows: sortW(wins), per_day: Math.max(1, c.per_day + d), max_per_day: Math.max(1, c.max_per_day + d), by: me, at: new Date().toISOString()});
}
$("view").addEventListener("click", async e => {
  const t = e.target;
  let b = t.closest("[data-stg]"); if (b) { stg = b.dataset.stg; saveLocal(); render(); return; }
  if (t.closest("[data-feedall]")) { liveFeedAll = !liveFeedAll; return paintLive(); }
  b = t.closest("[data-dl]"); if (b) return downloadSlides(byKey[b.dataset.dl], b);
  b = t.closest("[data-copy]"); if (b) { const p = byKey[b.dataset.copy]; navigator.clipboard.writeText(edits[p.key]?.caption ?? p.caption).then(() => toast("Подпись скопирована"), () => toast("Не скопировалось", 1)); return; }
  b = t.closest("[data-up]");
  if (b && !db) {                                   // без токена: отметка в этом браузере; статус «вышел» конвейер ставит сам, найдя пост в ленте
    const k = b.dataset.up; upMarks[k] = upMarks[k] ? 0 : Date.now();
    try { localStorage.setItem("akm-up", JSON.stringify(upMarks)); } catch (e) {}
    toast(upMarks[k] ? "Отмечено. Конвейер сам найдёт пост в ленте за ~15 мин" : "Отметка снята"); return render(); }
  if (b && db) { const p = byKey[b.dataset.up]; b.disabled = true; b.textContent = "Сохраняю…";
    try { await decide(p, "uploaded", "", {uploaded_at: nowMsk().replace(" ", "T")}); toast("Отмечено: залит"); render(); }
    catch (err) { b.disabled = false; b.textContent = "Залито ✓"; toast("Не сохранилось: " + err.message, 1); }
    return; }
  b = t.closest("[data-pick]"); if (b) { acc = b.dataset.pick; if (view === "accs") view = "flow"; saveLocal(); render(); return window.scrollTo({top: 0}); }
  b = t.closest("[data-sort]"); if (b) { sortBy = b.dataset.sort; return render(); }
  b = t.closest(".hours [data-hour]"); if (b) { const h = +b.dataset.hour, c = cfgOf(accByName[acc]);
    if (c.windows.some(w => wStart(w) === h)) { toast(`Окно ${pad(h)}:05 уже есть`); return; }
    pick[acc] = pick[acc] === h ? null : h; return render(); }
  if (t.closest("[data-unpick]")) { pick[acc] = null; return render(); }
  b = t.closest("[data-addgo]");
  if (b && db) { const h = +b.dataset.addgo, c = cfgOf(accByName[acc]);
    b.disabled = true; b.textContent = "Сохраняю…";
    try { await saveWindows(acc, [...c.windows, `${pad(h)}-${pad(h + 1)}`]); pick[acc] = null; render(); toast(`Окно ${pad(h)}:05 добавлено`); }
    catch (err) { b.disabled = false; b.textContent = "Добавить окно"; toast("Не сохранилось: " + err.message, 1); }
    return; }
  b = t.closest("[data-rmw]");
  if (b && db) { const w = b.dataset.rmw;
    if (confirmRm[acc] !== w) { confirmRm[acc] = w; render(); setTimeout(() => { if (confirmRm[acc] === w) { confirmRm[acc] = null; render(); } }, 4000); return; }
    confirmRm[acc] = null; b.disabled = true; b.textContent = "Убираю…";
    try { await saveWindows(acc, cfgOf(accByName[acc]).windows.filter(x => x !== w)); render(); toast(`Окно ${pad(wStart(w))}:05 убрано`); }
    catch (err) { b.disabled = false; render(); toast("Не сохранилось: " + err.message, 1); }
    return; }
  b = t.closest(".cell"); if (b && !b.disabled) return openSlot(acc, b.dataset.sk);
  b = t.closest("[data-open]"); if (b) return openPost(b.dataset.open);
  b = t.closest("[data-quick]");
  if (b && db) {
    const p = byKey[b.dataset.quick], s = bestFree(p.account); if (!s) return;
    b.disabled = true; b.textContent = "Сохраняю…";
    try { await decide(p, "approved", "", {slot: s.key}); toast(`Одобрен · ${slotLabel(s.key)}`); }
    catch (err) { b.disabled = false; b.textContent = "Не вышло, ещё раз"; toast("Не сохранилось: " + err.message, 1); }
  }
});

/* ---------- решения ---------- */
async function decide(p, decision, comment, extra) {
  await store.put("decisions", p.key, {decision, comment: comment || "", by: me, at: new Date().toISOString(), headline: p.headline, ...(extra || {})});
}
const dlg = $("dlg"), pdlg = $("pdlg");
dlg.addEventListener("close", () => render()); pdlg.addEventListener("close", () => render());
const xbtn = `<button class="x" data-close aria-label="Закрыть">×</button>`;
const needDb = () => db ? "" : `<p class="note">Сначала нажмите «Подключить запись» вверху.</p>`;
function strengthBlock(s, wdi) {
  if (!s) return `<div class="sbig"><b class="no">—</b><p>Силу слота не посчитать: у аккаунта мало постов с замером охвата.</p></div>`;
  return `<div class="sbig"><b class="${sCls(s)}">${s.score}</b><p><strong>${sWord(s)[0].toUpperCase() + sWord(s).slice(1)} слот.</strong> Посты в это время${wdi != null ? " (" + WDF[wdi] + " весит больше)" : ""} набирают ${xr(s)} к обычному: ожидаемый ${s.metric} ≈ <strong>${fmt(s.expect)}</strong> при медиане ${fmt(s.med)}. Опора — ${s.near} пост. рядом, уверенность ${s.conf}.</p></div>`;
}
function openSlot(name, sk) {
  const m = slotModel(name), s = m.rows.flatMap(r => r.cells).find(x => x.key === sk); if (!s) return;
  const head = xbtn + `<h2>${slotLabel(sk)} · @${esc(name)}</h2>`;
  if (s.p) {
    const p = s.p;
    dlg.innerHTML = head + strengthBlock(s.str, s.wdi) + `<div class="plist">${prow(p, (pending(p) ? "решение ждёт применения · " : "") + ({booked: "одобрен", published: "опубликован", late: "просрочен"}[s.st] || ""))}</div>
      <div class="btns" style="margin-top:14px">${p.permalink ? `<a class="btn" href="${esc(p.permalink)}" target="_blank" rel="noopener">Пост в Instagram</a>` : ""}
      ${p.status !== "published" ? `<button class="btn danger" data-unslot="${esc(p.key)}" ${db ? "" : "disabled"}>Снять со слота</button>` : ""}</div>${p.status !== "published" ? needDb() : ""}`;
  } else {
    const cands = D.posts.filter(p => p.account === name && ["wait", "low"].includes(bucket(p)))
      .sort((x, y) => (bucket(x) === "wait" ? 0 : 1) - (bucket(y) === "wait" ? 0 : 1) || (y.critic?.score || 0) - (x.critic?.score || 0));
    dlg.innerHTML = head + strengthBlock(s.str, s.wdi) + `<p class="state">Выберите пост — он будет одобрен и встанет в этот слот.</p>${needDb()}
      <div class="plist">${cands.length ? cands.map(p => `<div class="prow"><span class="th"><img data-enc="${p.slides[0]}" alt=""></span><span><span class="ti">${esc(flat(p.headline))}</span><span class="su">${bucket(p) === "wait" ? "готов" : "не прошёл критика"} · балл ${p.critic?.score ?? "—"}</span></span>
        <button class="btn go sm" data-put="${esc(p.key)}" data-slot="${sk}" ${db ? "" : "disabled"}>Сюда</button></div>`).join("") : `<p class="state">Готовых постов для этого аккаунта нет — нужна новая партия.</p>`}</div>`;

function prow(p, sub) {

}
dlg.addEventListener("click", async e => {

/* ---------- идея, слабые места, место среди своих и конкурентов, кадры ---------- */
const nf = n => n == null ? "—" : (n > 0 ? "+" : "") + fmt(n);

    <p>${esc(I.text)}</p>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Открыть пост-основу @${esc(r.acc)} ↗</a>` : ""}</div>`;
}
function weakBlock(p) {

    ${R && R.acc_pct != null ? `<div class="rk ${cls(R.acc_pct)}"><b>лучше ${R.acc_pct}%</b>постов @${esc(p.account)} (${R.acc_n})</div>` : ""}
    ${C ? `<div class="rk ${C.top_pct <= 20 ? "hi" : C.top_pct > 60 ? "lo" : ""}"><b>топ ${C.top_pct}%</b>основа среди ${C.n} постов конкурентов ниши по приросту подписчиков за 10 дней</div>`

/* ---------- экран «Заливка»: ручные каналы без API — заливщик скачивает слайды, копирует подпись, отмечает «залито» ---------- */
const FILES_RAW = p => `https://raw.githubusercontent.com/${REPO}/pulse-files/${p}`;
async function fullBlob(path) {
  const r = await fetch(FILES_RAW(path), {cache: "force-cache"}); if (!r.ok) throw new Error("HTTP " + r.status);
  return new Blob([await window.akmOpen(new Uint8Array(await r.arrayBuffer()))], {type: "image/jpeg"});
}
async function downloadSlides(p, btn) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Готовлю…";
  try {
    const paths = p.full || [];
    if (!paths.length) throw new Error("полноразмерных слайдов ещё нет — подождите пересборку пульта");
    const blobs = await Promise.all(paths.map(fullBlob));
    const files = blobs.map((b, j) => new File([b], `${p.account}_${String(j + 1).padStart(2, "0")}.jpg`, {type: "image/jpeg"}));
    if (navigator.canShare && navigator.canShare({files})) { await navigator.share({files, title: p.headline}); }   // телефон: «Сохранить в Фото» одним нажатием
    else files.forEach((f, j) => setTimeout(() => { const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); }, j * 350));
    toast("Слайды: " + files.length + " шт.");
  } catch (e) { if (e.name !== "AbortError") toast("Не скачалось: " + e.message, 1); }
  btn.disabled = false; btn.textContent = label;
}
let upMarks = {}; try { upMarks = JSON.parse(localStorage.getItem("akm-up") || "{}"); } catch (e) {}

  const todo = list.filter(p => bucket(p) === "ok");
  $("view").innerHTML = `<section><div class="ph" style="padding:0 6px"><h2>Заливка</h2><span class="n">${todo.length}</span><span class="hint">ручные каналы (${man.length}) · одобренные посты по времени слота. «Скачать» на телефоне сохраняет слайды в галерею. Выложенный пост конвейер сам находит в ленте за ~15 мин и переносит в «Вышли» — вход и токен не нужны</span></div>
    <div class="upl">${list.length ? list.map(p => { const sl = (pending(p) && decisions[p.key]?.slot) || p.slot, done = bucket(p) === "pub";
      const mine = !done && upMarks[p.key];
      return `<article class="uc ${done || mine ? "done" : ""}"><button class="uimg" data-open="${esc(p.key)}" aria-label="Открыть пост"><img data-enc="${p.slides[0] || ""}" alt=""></button>
      <div class="ub"><span class="hint">@${esc(p.account)} · ${done ? "вышел " + esc((p.published_at || "").slice(5, 16).replace("T", " ")) + (p.permalink ? ` · <a href="${esc(p.permalink)}" target="_blank" rel="noopener">в ленте ↗</a>` : "") : mine ? "отмечен вами — ждём, когда пост появится в ленте" : sl ? "залить " + slotLabel(sl) + " МСК" : "время не назначено"}</span>
        <h3>${esc(flat(p.headline))}</h3><div class="cap-prev">${esc(edits[p.key]?.caption ?? p.caption)}</div>
        <div class="btns"><button class="btn sm go" data-dl="${esc(p.key)}">Скачать ${p.slides.length} слайд.</button><button class="btn sm" data-copy="${esc(p.key)}">Копировать подпись</button>
        ${done ? "" : `<button class="btn sm" data-up="${esc(p.key)}">${mine ? "Снять отметку" : "Залито ✓"}</button>`}</div></div></article>`; }).join("")
      : `<div class="empty"><b>Нечего заливать</b>Одобрите посты ручных каналов на экране «Конвейер» — они появятся здесь со временем слота.</div>`}</div></section>`;
}

/* ---------- карточка поста ---------- */
function card(p) {
  const c = p.critic || {}, pr = c.parts || {}, dcs = decisions[p.key], b = bucket(p), pend = pending(p), i = p._i;
  const pill = {wait: ["wait", "ждёт решения"], ok: ["ok", "одобрен"], redo: ["redo", "на доработке"], pub: ["pub", "опубликован"], low: ["", "черновик"], off: ["", "снят"]}[b];
  const who = dcs ? `${names[dcs.by] || "редактор"} · ${new Date(dcs.at).toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})}` : "";
  const res = p.result ? `<dt>Итог 24 ч</dt><dd>охват ${fmt(p.result.reach)} (×${p.result.x_reach} медианы), репосты ${p.result.shares_per_1k}/1000, подписки ${p.result.follows_per_1k}/1000 — ${esc(p.result.verdict)}</dd>` : "";
  const ed = edits[p.key], capText = ed?.caption ?? p.caption, capPend = ed && ed.caption !== p.caption;
  const slotKey = (pend && dcs.decision === "approved" && dcs.slot) ? dcs.slot : p.slot;
  const slotStr = slotKey && strength(p.account, +slotKey.slice(11, 13), wdOf(slotKey.slice(0, 10)));
  const free = p.status === "published" ? [] : freeSlots(p.account);
  const best = bestFree(p.account);
  const DL = {approved: "одобрен", rework: "на доработку", reject: "снят", unapprove: "одобрение отменено"};
  return `<article class="post" data-key="${esc(p.key)}">
  <div class="gal"><button class="main" data-j="0" aria-label="Открыть слайды"><img data-enc="${p.slides[0] || ""}" id="galMain" alt=""></button>
    <div class="th">${p.slides.map((s, j) => `<button data-th="${j}" aria-current="${j === 0}" aria-label="Слайд ${j + 1}"><img data-enc="${s}" alt=""></button>`).join("")}</div></div>
  <div class="info">
  <div class="top"><span class="pill ${pill[0]}">${pill[1]}</span><span class="hint">@${esc(p.account)} · ${FMT[p.format] ? FMT[p.format] + (p.series_day ? " " + p.series_day + "/7" : "") : (TYPE[p.type] || esc(p.type || ""))}</span>${p.collab ? `<span class="pill">совместно с @${esc(p.collab)}</span>` : ""}
    <span class="big-score">${c.score ?? "—"}<small>/10</small></span></div>
  <h3>${esc(p.headline)}</h3>
  ${Object.keys(pr).length ? `<div class="parts">${PARTS.filter(([ks]) => partVal(pr, ks) != null).map(([ks, l]) => { const v = partVal(pr, ks); return `<div class="part ${v >= 8 ? "hi" : v <= 5 ? "lo" : ""}"><small>${l}</small><b>${v}</b></div>`; }).join("")}</div>` : ""}
  ${weakBlock(p)}${ideaBlock(p)}
  ${p.status === "published" ? (p.permalink ? `<a class="btn" href="${esc(p.permalink)}" target="_blank" rel="noopener">Пост в Instagram</a>` : "") : `
  <div class="decide">
    ${dcs ? `<p class="state">Решение: <b>${DL[dcs.decision] || esc(dcs.decision)}</b>${pend ? " (ждёт применения)" : ""} · ${esc(who)}${dcs.comment ? `<br>«${esc(dcs.comment)}»` : ""}</p>` : ""}
    <label class="f" for="sl-${i}">Слот публикации</label>
    <select class="f" id="sl-${i}">${b === "ok" && slotKey ? `<option value="${slotKey}">Оставить: ${slotLabel(slotKey)}${slotStr ? " · сила " + slotStr.score : ""}</option>` : ""}${best ? `<option value="${best.key}">★ ${slotLabel(best.key)}${best.str ? " · сила " + best.str.score : ""} (лучший в ближайшие 48 ч)</option>` : ""}${free.filter(s => !best || s.key !== best.key).map(s => `<option value="${s.key}">${slotLabel(s.key)}${s.str ? " · сила " + s.str.score : ""}</option>`).join("")}${free.length ? "" : `<option value="">свободных слотов нет — ближайший при синхронизации</option>`}</select>
    <div class="btns"><button class="btn go" data-act="approved" ${db ? "" : "disabled"}>${b === "ok" ? "Переставить" : "Одобрить"}</button>
      ${b === "ok" ? `<button class="btn" data-act="unapprove" ${db ? "" : "disabled"}>Отменить одобрение</button>` : ""}
      ${b !== "off" ? `<button class="btn danger" data-act="reject" ${db ? "" : "disabled"}>Снять</button>` : `<button class="btn" data-act="unapprove" ${db ? "" : "disabled"}>Вернуть в проверку</button>`}</div>
    <label class="f" for="cm-${i}">Что поправить (для доработки обязательно)</label>
    <textarea id="cm-${i}" placeholder="Слайд, текст, картинка…">${esc(pend ? dcs?.comment || "" : "")}</textarea>
    <div class="btns"><button class="btn warn" data-act="rework" ${db ? "" : "disabled"}>Отправить на доработку</button></div>
    ${db ? "" : `<p class="note">Кнопки заработают после «Подключить запись» (токен GitHub, один раз на браузер).</p>`}
  </div>`}
  ${rankBlock(p)}
  <div class="why"><h4>Почему этот пост</h4><p>${esc(c.why_viral || p.why || "—")}</p>
    <dl class="kv"><dt>Тема</dt><dd>${esc(p.topic)}</dd>${p.source ? `<dt>Источник</dt><dd>${esc(p.source)}</dd>` : ""}${p.keyword ? `<dt>Слово</dt><dd>${esc(p.keyword)} → в личку уходит список</dd>` : ""}<dt>Сильное</dt><dd>${esc(c.best || "—")}</dd><dt>Слабое</dt><dd>${esc(c.worst || "—")}</dd>
    <dt>Прогноз</dt><dd>${esc(c.predicted_reach || "—")}</dd><dt>Слот</dt><dd>${slotKey ? slotLabel(slotKey) + " " + (slotStr ? pw(slotStr, 1) : "") : "назначится после одобрения"}</dd><dt>Стоимость</dt><dd>${p.cost != null ? p.cost + " ₽" : "—"}</dd>${res}</dl></div>
  <details class="more"><summary>Подпись и источники${capPend ? " · правка ждёт применения" : ""}</summary>
    ${p.status === "published" ? `<div class="cap">${esc(p.caption)}</div>` : `<textarea id="cap-${i}" style="margin-top:8px;min-height:170px">${esc(capText)}</textarea>
    <div class="btns" style="margin-top:8px"><button class="btn sm" data-act="cap" ${db ? "" : "disabled"}>Сохранить подпись</button></div>`}
    <ul>${(p.sources || []).map(s => `<li><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a></li>`).join("")}</ul></details>
  ${imgBlock(p)}
  ${postLog(p.key)}
  ${(c.fixes || []).length ? `<details class="more"><summary>Замечания критика (${c.fixes.length})</summary><ul>${c.fixes.map(f => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}
  </div></article>`;
}
function openPost(key) {
  const p = byKey[key];
  if (!p) { const b = (D.building || []).find(x => x.key === key); if (!b) return;
    pdlg.className = ""; pdlg.innerHTML = xbtn + `<h2>${esc(b.headline)}</h2><p class="state">@${esc(b.account)} · ${STAGES.find(s => s[0] === BSTAGE[b.status])?.[2] || b.status} · обновлено ${ago(b.updated)}${b.live ? " · идёт сейчас" : ""}</p><p class="hint" style="margin-top:10px">Пост ещё собирается. Обложка, слайды и оценка появятся, когда конвейер дойдёт до проверки.</p>`;
    return pdlg.showModal(); }
  pdlg.className = "wide"; pdlg.innerHTML = xbtn + card(p); pdlg.showModal(); hydrate(true);
}
pdlg.addEventListener("click", async e => {
  if (e.target === pdlg || e.target.closest("[data-close]")) return pdlg.close();
  const art = e.target.closest(".post"); if (!art) return;
  const p = byKey[art.dataset.key], i = p._i;
  const th = e.target.closest("[data-th]");
  if (th) { const j = +th.dataset.th; art.querySelectorAll("[data-th]").forEach(x => x.setAttribute("aria-current", x === th)); art.querySelector(".gal .main").dataset.j = j;
    encUrl(p.slides[j]).then(u => { $("galMain").src = u; }); return; }
  const mb = e.target.closest(".gal .main"); if (mb) return openLb(p, +mb.dataset.j || 0);
  const btn = e.target.closest("[data-act]"); if (!btn || !db) return;
  const act = btn.dataset.act, label = btn.textContent;
  btn.disabled = true; btn.textContent = "Сохраняю…";
  try {
    if (act === "cap") {
      await store.put("edits", p.key, {caption: art.querySelector("#cap-" + i).value.trim(), by: me, at: new Date().toISOString(), headline: p.headline});
      btn.textContent = "Сохранено"; btn.disabled = false; toast("Подпись сохранена");
    } else {
      const ta = art.querySelector("#cm-" + i), comment = ta ? ta.value.trim() : "";
      if (act === "rework" && !comment) { ta.focus(); ta.placeholder = "Напишите, что поправить — без комментария доработку не отправить"; btn.disabled = false; btn.textContent = label; return; }
      const sel = art.querySelector("#sl-" + i), slot = act === "approved" ? (sel?.value || "") : "";
      await decide(p, act, comment, slot ? {slot} : {});
      pdlg.close(); render();
      toast({approved: "Одобрен" + (slot ? " · " + slotLabel(slot) : ""), rework: "Отправлен на доработку", reject: "Снят", unapprove: "Одобрение отменено"}[act] || "Сохранено");
    }
  } catch (err) { btn.disabled = false; btn.textContent = label; toast("Не сохранилось: " + err.message, 1); }
});

let lp = null, lj = 0;
function openLb(p, j) { lp = p; lj = j; showLb(); $("lb").hidden = false; $("lbX").focus(); }
function showLb() { lj = (lj + lp.slides.length) % lp.slides.length; encUrl(lp.slides[lj]).then(u => { if (lp.slides[lj] && $("lbImg")) $("lbImg").src = u; }); $("lbC").textContent = `${lj + 1} / ${lp.slides.length} · @${lp.account}`; }
$("lbX").onclick = () => $("lb").hidden = true;
$("lbP").onclick = () => { lj--; showLb(); };
$("lbN").onclick = () => { lj++; showLb(); };
$("lb").addEventListener("click", e => { if (e.target.id === "lb") $("lb").hidden = true; });
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") $("lb").hidden = true;
  if (e.key === "ArrowLeft") { lj--; showLb(); }
  if (e.key === "ArrowRight") { lj++; showLb(); }
});

function hydrate(now) {
  const load = el => { if (!el.dataset.enc) return; encUrl(el.dataset.enc).then(u => { el.src = u; }).catch(() => { el.alt = "не загрузилось"; }); };
  const io = hydrate.io || (hydrate.io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; io.unobserve(e.target); load(e.target); }), {rootMargin: "800px"}));
  document.querySelectorAll("img[data-enc]:not([src])").forEach(i => now || i.closest("dialog") ? load(i) : io.observe(i));
}
function rerender() { if (dlg.open || pdlg.open) return; const a = document.activeElement; if (a && a.tagName === "TEXTAREA" && a.value) return; render(); }

/* ---------- хранилище: pulse/inbox/*.enc в ОТДЕЛЬНОЙ ветке pulse-inbox (шифр пинкодом) — клики не запускают сборку GitHub Pages.
   Читать может любой вошедший (raw.githubusercontent.com), писать — с токеном GitHub через API.
   decisions — одобрения/правки/снятия, edits — подписи, slotcfg — окна публикации. Применяет pulse_watch.py (≈1 мин). ---------- */
const REPO = "akm-agency/akm-ig-radar", INBOX = "pulse/inbox/", BRANCH = "pulse-inbox";
let token = ""; try { token = localStorage.getItem("akm-gh") || ""; } catch (e) {}
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const gh = (path, opt = {}) => fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, {...opt, cache: "no-store",
  headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json", ...(opt.headers || {})}});
const MAPS = {decisions: () => decisions, edits: () => edits, slotcfg: () => slotcfg};
const store = {
  async read(name) {
    if (token) {
      const r = await gh(INBOX + name + ".enc?ref=" + BRANCH);
      if (r.status === 404) return {map: {}, sha: null};
      if (!r.ok) throw new Error("GitHub " + r.status);
      const j = await r.json();
      // Contents JSON может перекодировать бинарный файл. Берём исходные байты по тому же SHA, который пойдёт в PUT.
      const raw = await fetch(`https://api.github.com/repos/${REPO}/git/blobs/${j.sha}`, {cache: "no-store",
        headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json"}});
      if (!raw.ok) throw new Error("GitHub " + raw.status);
      return {map: JSON.parse(new TextDecoder().decode(await window.akmOpen(new Uint8Array(await raw.arrayBuffer())))), sha: j.sha};
    }
    const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${INBOX}${name}.enc?t=${Date.now()}`, {cache: "no-store"});
    if (!r.ok) return {map: {}, sha: null};
    return {map: JSON.parse(new TextDecoder().decode(await window.akmOpen(new Uint8Array(await r.arrayBuffer())))), sha: null};
  },
  async put(name, key, doc) {
    if (!token) throw new Error("нет токена");
    for (let n = 0; n < 4; n++) {
      const {map, sha} = await store.read(name);
      map[key] = doc;
      const body = {message: "Пульт: " + name + " " + key, branch: BRANCH, content: b64(await window.akmSeal(new TextEncoder().encode(JSON.stringify(map))))};
      if (sha) body.sha = sha;
      const r = await gh(INBOX + name + ".enc", {method: "PUT", body: JSON.stringify(body)});
      if (r.ok) { MAPS[name]()[key] = doc; rerender(); return; }
      if (r.status === 401 || r.status === 403) throw new Error("токен GitHub не принят — переподключите запись");
      if (r.status !== 409 && r.status !== 422) throw new Error("GitHub " + r.status);   // конфликт — кто-то записал раньше, читаем заново
    }
    throw new Error("конфликт записи, попробуйте ещё раз");
  },
};
async function refresh() {
  try {
    const [a, b, c] = await Promise.all(["decisions", "edits", "slotcfg"].map(n => store.read(n)));
    decisions = a.map; edits = b.map; slotcfg = c.map;
    Object.values(decisions).forEach(x => { if (x.by) names[x.by] = x.by; });
    rerender();
  } catch (e) { $("meta").textContent = metaText() + " · не удалось обновить решения: " + e.message; }
}
const metaText = () => `Данные обновлены ${D.updated} · публикация только после «Одобрить» · решения применяются за 1–2 минуты`;
function ghLabel() { const g = $("gh"); g.className = "who " + (token ? "on" : "off"); g.innerHTML = token ? `<i></i>${me ? esc(me) : "запись включена"}` : `<i></i>Подключить запись`; db = token ? store : null; }
$("gh").onclick = () => {
  dlg.innerHTML = xbtn + `<h2>Запись решений</h2>
    <p class="state" style="margin:6px 0 12px">Решения («Одобрить», «Снять», слоты, окна, подписи) сохраняются файлами в репозитории akm-ig-radar. Нужен токен GitHub: fine-grained, только репозиторий akm-ig-radar, право Contents: Read and write. Токен хранится только в этом браузере.</p>
    <input id="tk" type="password" autocomplete="off" placeholder="github_pat_…">
    <div class="btns" style="margin-top:12px"><button class="btn primary" id="tkOk">Сохранить</button>${token ? '<button class="btn danger" id="tkDel">Отключить</button>' : ""}</div><p class="note" id="tkErr" style="margin-top:8px"></p>`;
  dlg.showModal();
  $("tkOk").onclick = async () => {
    const v = $("tk").value.trim(); if (!v) return;
    token = v; $("tkErr").textContent = "Проверяю…";
    try {
      const u = await fetch("https://api.github.com/user", {headers: {Authorization: "Bearer " + token}}).then(r => { if (!r.ok) throw new Error("токен не принят (" + r.status + ")"); return r.json(); });
      const t = await gh(INBOX.slice(0, -1) + "?ref=" + BRANCH);
      if (t.status === 401 || t.status === 403) throw new Error("у токена нет доступа к репозиторию");
      try { localStorage.setItem("akm-gh", token); } catch (e) {}
      me = u.login; names[me] = me; ghLabel(); dlg.close(); refresh(); toast("Запись включена");
    } catch (e) { token = ""; $("tkErr").textContent = e.message; }
  };
  if ($("tkDel")) $("tkDel").onclick = () => { try { localStorage.removeItem("akm-gh"); } catch (e) {} token = ""; me = null; ghLabel(); dlg.close(); };
};
$("out").onclick = () => window.akmLogout();

$("meta").textContent = metaText();
ghLabel();
render();
if (token) fetch("https://api.github.com/user", {headers: {Authorization: "Bearer " + token}}).then(r => r.ok ? r.json() : null).then(u => { if (u) { me = u.login; names[me] = me; ghLabel(); } });
refresh();
setInterval(refresh, 45000);
loadLive();
setInterval(() => { if (!document.hidden) loadLive(); }, token ? 12000 : 45000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}).catch(e => { document.body.insertAdjacentHTML("beforeend", '<p style="padding:24px;font:14px system-ui">Пульт не загрузился: ' + String(e.message || e).replace(/</g, "&lt;") + ". Обновите страницу.</p>"); });
</script>
</body></html>
