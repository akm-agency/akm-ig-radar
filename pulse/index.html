  #akmGate.shake form{animation:akmShake .4s}@keyframes akmShake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}`;

    pick[acc] = pick[acc] === h ? null : h; return render(); }
  if (t.closest("[data-unpick]")) { pick[acc] = null; return render(); }
  b = t.closest("[data-addgo]");

    b.disabled = true; b.textContent = "Сохраняю…";

    catch (err) { b.disabled = false; b.textContent = "Добавить окно"; toast("Не сохранилось: " + err.message, 1); }
    return; }

    confirmRm[acc] = null; b.disabled = true; b.textContent = "Убираю…";
    try { await saveWindows(acc, cfgOf(accByName[acc]).windows.filter(x => x !== w)); render(); toast(`Окно ${pad(wStart(w))}:05 убрано`); }
    catch (err) { b.disabled = false; render(); toast("Не сохранилось: " + err.message, 1); }

  }
});

}

function openSlot(name, sk) {

/* ---------- идея, слабые места, место среди своих и конкурентов, кадры ---------- */
const nf = n => n == null ? "—" : (n > 0 ? "+" : "") + fmt(n);
function ideaBlock(p) {
  const I = p.idea; if (!I) return "";
  const r = I.ref || {}, nums = [];
  if (r.extra != null) nums.push(`${nf(r.extra)} подписчиков сверх обычного за ${r.hours || 6} ч`);
  else if (r.excess != null) nums.push(`${nf(Math.round(r.excess))} подписчиков сверх фона`);
  if (r.follows != null) nums.push(`подписок ${fmt(r.follows)}`);
  if (r.reach) nums.push(`охват ${fmt(r.reach)}`);
  if (r.x_med) nums.push(`лайки ×${r.x_med}`);
  if (r.subs_x) nums.push(`приток подписчиков ×${r.subs_x}${(r.owners || 1) > 1 ? " у " + r.owners + " страниц" : ""}`);
  return `<div class="idea"><h4>Идея поста${I.format ? " · " + esc(I.format) : ""}${p.pillar ? " · рубрика «" + esc(p.pillar) + "»" : ""}</h4>${nums.length ? `<div class="nums">${nums.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
    <p>${esc(I.text)}</p>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Открыть пост-основу @${esc(r.acc)} ↗</a>` : ""}</div>`;
}
function repairOptions(p) {
  const out = [...(p.repair_options || [])];
  for (const label of p.editor_audit ? [] : [...(p.weak || []).map(x => x.t), ...(p.critic?.fixes || [])]) {
    if (typeof label === "string" && !out.some(x => x.label === label)) out.push({kind: "auto", label, critical: false});
  }
  const level = x => x.critical ? "bad" : /подпис|ниже прежнего порога/i.test(x.label) ? "note" : ["bad", "risk", "note"].includes(x.level) ? x.level : /картин.*не по тексту|обложка не про|связн.*истори|обещание.*не выполн|не чита|[0-4]\/10|неверн.*факт|чужой ниш/i.test(x.label) ? "risk" : "note";
  return out.map(x => ({...x, level: level(x)})).sort((a, b) => ({bad: 0, risk: 1, note: 2}[a.level] - {bad: 0, risk: 1, note: 2}[b.level]));
}
function weakBlock(p) {
  const W = p.weak || [];
  if (!W.length) return `<div class="weak none"><h4>Слабые места</h4><p class="hint">Явных слабых мест конвейер не нашёл.</p></div>`;
  return `<div class="weak"><h4>Замечания · ${W.length}</h4><ul>${W.map(w => `<li><b class="mid">заметка</b><span>${esc(w.t)}</span></li>`).join("")}</ul></div>`;
}

    ${R && R.acc_pct != null ? `<div class="rk ${cls(R.acc_pct)}"><b>лучше ${R.acc_pct}%</b>постов @${esc(p.account)} (${R.acc_n})</div>` : ""}
    ${C ? `<div class="rk ${C.top_pct <= 20 ? "hi" : C.top_pct > 60 ? "lo" : ""}"><b>топ ${C.top_pct}%</b>основа среди ${C.n} постов конкурентов ниши по приросту подписчиков за 10 дней</div>`

const SRC = {"интернет": "интернет", higgsfield: "ИИ · Higgsfield", "nano-api": "ИИ · API", "вручную": "вручную", "пусто": "ПУСТО"};

/* ---------- экран «Заливка»: ручные каналы без API — заливщик скачивает слайды, копирует подпись, отмечает «залито» ---------- */
const FILES_RAW = p => `https://raw.githubusercontent.com/${REPO}/pulse-files/${p}`;
async function fullBlob(path) {

  return new Blob([await window.akmOpen(new Uint8Array(await r.arrayBuffer()))], {type: "image/jpeg"});

/* ---------- 10.11: архив поста для ручной публикации — слайды 1080×1350 по порядку + caption.txt + info.txt одним .zip.

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  const put = (v, fields) => fields.forEach(([o, x, s]) => s === 4 ? v.setUint32(o, x, true) : v.setUint16(o, x, true));
  let off = 0;
  for (const f of files) {
    const nm = te.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const h = new DataView(new ArrayBuffer(30));          // локальный заголовок; флаг 0x0800 — имена в UTF-8

    out.push(h, nm, f.data);
    const c = new DataView(new ArrayBuffer(46));          // запись центрального каталога
    put(c, [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, tm, 2], [14, dt, 2], [16, crc, 4], [20, n, 4], [24, n, 4],
            [28, nm.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]]);
    dir.push(c, nm);

    <dl class="kv"><dt>Тема</dt><dd>${esc(p.topic)}</dd>${p.source ? `<dt>Источник</dt><dd>${esc(p.source)}</dd>` : ""}${p.keyword ? `<dt>Слово</dt><dd>${esc(p.keyword)} → в личку уходит список</dd>` : ""}<dt>Сильное</dt><dd>${esc(c.best || "—")}</dd><dt>Слабое</dt><dd>${esc(c.worst || "—")}</dd>
    <dt>Прогноз</dt><dd>${esc(c.predicted_reach || "—")}</dd><dt>Слот</dt><dd>${slotKey ? slotLabel(slotKey) + " " + (slotStr ? pw(slotStr, 1) : "") : "назначится после одобрения"}</dd><dt>Стоимость</dt><dd>${p.cost == null ? "—" : p.cost_exact ? `<b>${p.cost} ₽</b> по реальным вызовам${p.cost_stages ? "<br><span class='hint'>" + Object.entries(p.cost_stages).map(([k, v]) => esc(k) + " " + v + " ₽").join(" · ") + "</span>" : ""}` : `≈ ${p.cost} ₽ <span class="hint">старая оценка: без проверки кадров, доводки и запасного API — реальная цена в 3–5 раз выше</span>`}</dd>${res}</dl></div>
  <details class="more"><summary>Подпись и источники${capPend ? " · правка ждёт применения" : ""}</summary>
    ${p.status === "published" ? `<div class="cap">${esc(p.caption)}</div>` : `<textarea id="cap-${i}" style="margin-top:8px;min-height:170px">${esc(capText)}</textarea>
    <div class="btns" style="margin-top:8px"><button class="btn sm" data-act="cap" ${db ? "" : "disabled"}>Сохранить подпись</button></div>`}
    <ul>${(p.sources || []).map(s => `<li><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a></li>`).join("")}</ul></details>
  ${imgBlock(p)}
  ${postLog(p.key)}
  ${p.status === "published" && (c.fixes || []).length ? `<details class="more"><summary>Замечания критика (${c.fixes.length})</summary><ul>${c.fixes.map(f => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}
  </div></article>`;
}
function openPost(key) {
  const p = byKey[key];
  if (!p) { const b = (D.building || []).find(x => x.key === key); if (!b) return;
    pdlg.className = ""; pdlg.innerHTML = xbtn + `<h2>${esc(b.headline)}</h2><p class="state">@${esc(b.account)} · ${STAGES.find(s => s[0] === BSTAGE[b.status])?.[2] || b.status} · обновлено ${ago(b.updated)}${b.stalled ? " · нет продвижения более 6 часов" : b.live ? " · менялся недавно" : ""}</p>${b.error ? `<p class="note">${esc(b.error)}</p>` : ""}<p class="hint" style="margin-top:10px">${b.stalled ? "Остаток остановленной сборки. Пост сохранён, автоматическое возобновление не запущено." : "Пост ещё собирается. Обложка, слайды и оценка появятся, когда конвейер дойдёт до проверки."}</p>`;
    return pdlg.showModal(); }
  pdlg.className = "wide"; pdlg.innerHTML = xbtn + card(p); pdlg.showModal(); hydrate(true);
}
pdlg.addEventListener("change", e => {        // слот выбрали в списке — подсветить его на карте недели
  const sel = e.target.closest('select.f[id^="sl-"]'), art = sel?.closest(".post"); if (art && sel.value) pickSlot(art, sel.value);
});
pdlg.addEventListener("click", async e => {
  if (e.target === pdlg || e.target.closest("[data-close]")) return pdlg.close();
  const art = e.target.closest(".post"); if (!art) return;
  const p = byKey[art.dataset.key], i = p._i;
  const th = e.target.closest("[data-th]");
  if (th) { const j = +th.dataset.th; art.querySelectorAll("[data-th]").forEach(x => x.setAttribute("aria-current", x === th)); art.querySelector(".gal .main").dataset.j = j;
    encUrl(p.slides[j]).then(u => { $("galMain").src = u; }); return; }
  const mb = e.target.closest(".gal .main"); if (mb) return openLb(p, +mb.dataset.j || 0);
  const rb = e.target.closest("[data-r]");
  if (rb) { const k = rb.closest("[data-rsn]").dataset.rsn, r = rb.dataset.r, cur = new Set(rsnSel[k] || []);
    cur.has(r) ? cur.delete(r) : cur.add(r); rsnSel[k] = [...cur]; rb.setAttribute("aria-pressed", cur.has(r)); return; }
  const ps = e.target.closest("[data-pslot]"); if (ps) return pickSlot(art, ps.dataset.pslot);
  const pl = e.target.closest("[data-play]"); if (pl) return togglePlay(pl);
  const mu = e.target.closest("[data-music]");
  if (mu) { copyText(mu.dataset.music).then(() => toast("Скопировано: " + mu.dataset.music + " — вставьте в поиск музыки Instagram"), () => toast("Не скопировалось", 1)); return; }
  const hb = e.target.closest('[data-act="zip"],[data-act="manual"],[data-act="tg"]');     // архив и ТГ — без записи; выбор слота сам подскажет про запись
  if (hb) return hb.dataset.act === "zip" ? downloadZip(p, hb) : hb.dataset.act === "tg" ? sendTg(p, hb) : openManual(p);
  const btn = e.target.closest("[data-act]"); if (!btn || !db) return;
  const act = btn.dataset.act, label = btn.textContent;
  btn.disabled = true; btn.textContent = "Сохраняю…";
  try {
    if (act === "cap") {
      await store.put("edits", p.key, {caption: art.querySelector("#cap-" + i).value.trim(), by: me, at: new Date().toISOString(), headline: p.headline});
      btn.textContent = "Сохранено"; btn.disabled = false; toast("Подпись сохранена");
    } else {
      const ta = art.querySelector("#cm-" + i), selected = [...art.querySelectorAll("[data-issue]:checked")].map(x => repairOptions(p)[+x.dataset.issue]);
      const comment = ta ? ta.value.trim() : "";
      const issues = [...selected];
      if (act === "rework" && !issues.length && comment) issues.push({kind: "auto", label: comment});
      if (act === "rework" && !issues.length) { toast("Отметьте замечания или опишите точечную правку", 1); btn.disabled = false; btn.textContent = label; return; }
      const reasons = act === "rescue" ? (selected.length ? selected : repairOptions(p)).map(x => x.label) : act === "rework" ? issues.map(x => x.label) : selected.map(x => x.label);
      const sel = art.querySelector("#sl-" + i), slot = act === "approved" ? (sel?.value || "") : "";
      await decide(p, act, comment, {...(slot ? {slot} : {}), reasons, ...(["rescue", "rework"].includes(act) ? {repair_mode: "selected", version: p.version, issues} : {})});
      pdlg.close(); render();
      toast({approved: "Одобрен" + (slot ? " · " + slotLabel(slot) : ""), rework: "Выбранные исправления отправлены", rescue: "Возвращён без правок", reject: "Снят", unapprove: "Одобрение отменено"}[act] || "Сохранено");
    }
  } catch (err) { btn.disabled = false; btn.textContent = label; toast("Не сохранилось: " + err.message, 1); }
});

let lp = null, lj = 0;
// 12.11: просмотр — модальный <dialog>, открывается поверх карточки (pdlg); закрытие возвращает в карточку.
// Листание по кругу: края картинки (по трети ширины), кнопки ‹ ›, стрелки ←/→, свайп; Esc закрывает только просмотр.
const lb = $("lb");
function openLb(p, j) { if (!p?.slides?.length) return; lp = p; lj = j; lb.classList.toggle("one", p.slides.length < 2); showLb(); if (!lb.open) lb.showModal(); $("lbX").focus(); }
function showLb() { const n = lp.slides.length, want = lj = (lj % n + n) % n, img = $("lbImg");
  encUrl(lp.slides[want]).then(u => { if (lp && lj === want && lb.open) img.src = u; }).catch(() => { img.alt = "не загрузилось"; });
  img.alt = `Слайд ${want + 1}`; $("lbC").textContent = `${want + 1} / ${n} · @${lp.account}`; }
const lbGo = d => { if (lp && lp.slides.length > 1) { lj += d; showLb(); } };
const lbClose = () => { if (lb.open) lb.close(); };
$("lbX").onclick = lbClose;
$("lbP").onclick = $("lbZP").onclick = () => lbGo(-1);
$("lbN").onclick = $("lbZN").onclick = () => lbGo(1);
lb.addEventListener("click", e => { if (e.target === lb) lbClose(); });
lb.addEventListener("cancel", e => { e.preventDefault(); lbClose(); });     // Esc: закрыть просмотр, карточку не трогать
let lbX0 = null;
lb.addEventListener("touchstart", e => { lbX0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, {passive: true});
lb.addEventListener("touchend", e => { if (lbX0 == null) return; const dx = e.changedTouches[0].clientX - lbX0; lbX0 = null;
  if (Math.abs(dx) > 50) { e.preventDefault(); lbGo(dx < 0 ? 1 : -1); } });
document.addEventListener("keydown", e => {
  if (!lb.open) return;
  if (e.key === "Escape") { e.preventDefault(); lbClose(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); lbGo(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); lbGo(1); }
});

function hydrate(now) {
  const load = el => { if (!el.dataset.enc) return; encUrl(el.dataset.enc).then(u => { el.src = u; }).catch(() => { el.alt = "не загрузилось"; }); };
  const io = hydrate.io || (hydrate.io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; io.unobserve(e.target); load(e.target); }), {rootMargin: "800px"}));
  document.querySelectorAll("img[data-enc]:not([src])").forEach(i => now || i.closest("dialog") ? load(i) : io.observe(i));
}
function rerender() { if (dlg.open || pdlg.open) return; const a = document.activeElement; if (a && a.tagName === "TEXTAREA" && a.value) return; render(); }

/* ---------- хранилище: pulse/inbox/*.enc в ОТДЕЛЬНОЙ ветке pulse-inbox (шифр пинкодом) — клики не запускают сборку GitHub Pages.
   Читать может любой вошедший (raw.githubusercontent.com), писать — с токеном GitHub через API.
   decisions — одобрения/правки/снятия, edits — подписи, slotcfg — окна публикации. Применяет pulse_watch.py (≈1 мин). ---------- */
const REPO = "akm-agency/akm-ig-radar", INBOX = "pulse/inbox/", BRANCH = "pulse-inbox";
let token = ""; try { token = localStorage.getItem("akm-gh") || ""; } catch (e) {}
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const gh = (path, opt = {}) => fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, {...opt, cache: "no-store",
  headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json", ...(opt.headers || {})}});
const MAPS = {decisions: () => decisions, edits: () => edits, slotcfg: () => slotcfg};
const store = {
  async read(name) {
    if (token) {
      const r = await gh(INBOX + name + ".enc?ref=" + BRANCH);
      if (r.status === 404) return {map: {}, sha: null};
      if (!r.ok) throw new Error("GitHub " + r.status);
      const j = await r.json();
      // Contents JSON может перекодировать бинарный файл. Берём исходные байты по тому же SHA, который пойдёт в PUT.
      const raw = await fetch(`https://api.github.com/repos/${REPO}/git/blobs/${j.sha}`, {cache: "no-store",
        headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json"}});
      if (!raw.ok) throw new Error("GitHub " + raw.status);
      return {map: JSON.parse(new TextDecoder().decode(await window.akmOpen(new Uint8Array(await raw.arrayBuffer())))), sha: j.sha};
    }
    const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${INBOX}${name}.enc?t=${Date.now()}`, {cache: "no-store"});
    if (!r.ok) return {map: {}, sha: null};
    return {map: JSON.parse(new TextDecoder().decode(await window.akmOpen(new Uint8Array(await r.arrayBuffer())))), sha: null};
  },
  async put(name, key, doc) {
    if (!token) throw new Error("нет токена");
    for (let n = 0; n < 4; n++) {
      const {map, sha} = await store.read(name);
      map[key] = doc;
      const body = {message: "Пульт: " + name + " " + key, branch: BRANCH, content: b64(await window.akmSeal(new TextEncoder().encode(JSON.stringify(map))))};
      if (sha) body.sha = sha;
      const r = await gh(INBOX + name + ".enc", {method: "PUT", body: JSON.stringify(body)});
      if (r.ok) { MAPS[name]()[key] = doc; rerender(); return; }
      if (r.status === 401 || r.status === 403) throw new Error("токен GitHub не принят — переподключите запись");
      if (r.status !== 409 && r.status !== 422) throw new Error("GitHub " + r.status);   // конфликт — кто-то записал раньше, читаем заново
    }
    throw new Error("конфликт записи, попробуйте ещё раз");
  },
};
async function refresh() {
  try {
    const [a, b, c] = await Promise.all(["decisions", "edits", "slotcfg"].map(n => store.read(n)));
    decisions = a.map; edits = b.map; slotcfg = c.map;
    Object.values(decisions).forEach(x => { if (x.by) names[x.by] = x.by; });
    rerender();
  } catch (e) { $("meta").textContent = metaText() + " · не удалось обновить решения: " + e.message; }
}
const metaText = () => `Данные обновлены ${D.updated} · публикация только после «Одобрить» · решения применяются за 1–2 минуты`;
function ghLabel() { const g = $("gh"); g.className = "who " + (token ? "on" : "off"); g.innerHTML = token ? `<i></i>${me ? esc(me) : "запись включена"}` : `<i></i><span class="lw">Подключить запись</span><span class="sw">Запись</span>`; db = token ? store : null; }
$("gh").onclick = () => {
  dlg.innerHTML = xbtn + `<h2>Запись решений</h2>
    <p class="state" style="margin:6px 0 12px">Решения («Одобрить», «Снять», слоты, окна, подписи) сохраняются файлами в репозитории akm-ig-radar. Нужен токен GitHub: fine-grained, только репозиторий akm-ig-radar, право Contents: Read and write. Токен хранится только в этом браузере.</p>
    <input id="tk" type="password" autocomplete="off" placeholder="github_pat_…">
    <div class="btns" style="margin-top:12px"><button class="btn primary" id="tkOk">Сохранить</button>${token ? '<button class="btn danger" id="tkDel">Отключить</button>' : ""}</div><p class="note" id="tkErr" style="margin-top:8px"></p>`;
  dlg.showModal();
  $("tkOk").onclick = async () => {
    const v = $("tk").value.trim(); if (!v) return;
    token = v; $("tkErr").textContent = "Проверяю…";
    try {
      const u = await fetch("https://api.github.com/user", {headers: {Authorization: "Bearer " + token}}).then(r => { if (!r.ok) throw new Error("токен не принят (" + r.status + ")"); return r.json(); });
      const t = await gh(INBOX.slice(0, -1) + "?ref=" + BRANCH);
      if (t.status === 401 || t.status === 403) throw new Error("у токена нет доступа к репозиторию");
      try { localStorage.setItem("akm-gh", token); } catch (e) {}
      me = u.login; names[me] = me; ghLabel(); dlg.close(); refresh(); toast("Запись включена");
    } catch (e) { token = ""; $("tkErr").textContent = e.message; }
  };
  if ($("tkDel")) $("tkDel").onclick = () => { try { localStorage.removeItem("akm-gh"); } catch (e) {} token = ""; me = null; ghLabel(); dlg.close(); };
};
$("out").onclick = () => window.akmLogout();

$("meta").textContent = metaText();
ghLabel();
render();
if (token) fetch("https://api.github.com/user", {headers: {Authorization: "Bearer " + token}}).then(r => r.ok ? r.json() : null).then(u => { if (u) { me = u.login; names[me] = me; ghLabel(); } });
refresh();
setInterval(refresh, 45000);
loadLive();
setInterval(() => { if (!document.hidden) loadLive(); }, token ? 12000 : 45000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}).catch(e => { document.body.insertAdjacentHTML("beforeend", '<p style="padding:24px;font:14px system-ui">Пульт не загрузился: ' + String(e.message || e).replace(/</g, "&lt;") + ". Обновите страницу.</p>"); });
</script>
