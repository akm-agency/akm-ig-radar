<!doctype html><html lang="ru"><head><meta charset="utf-8"><!--akm-gate--><meta name="robots" content="noindex"><script>/* Вход по пинкоду и расшифровка данных сайта (пара к site_crypto.py). export_pages подставляет a48e70ac1f6407cbb092d17883153692.
   Ключ после верного пинкода хранится в браузере (localStorage + cookie на год), пинкод запоминает менеджер паролей. */
(() => {
const SALT = "akm-ig-radar-v1", ITER = 150000, CHECK = "a48e70ac1f6407cbb092d17883153692", NAME = "akm_k";
const enc = s => new TextEncoder().encode(s);
const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
const W = new Uint32Array(64);
function sha256(msg) {   // синхронный SHA-256: ключевой поток — тысячи коротких хешей, WebCrypto для этого слишком медленный
  const l = msg.length, nb = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(nb);
  m.set(msg); m[l] = 0x80; const bits = l * 8;
  m[nb - 4] = bits >>> 24; m[nb - 3] = bits >>> 16; m[nb - 2] = bits >>> 8; m[nb - 1] = bits; m[nb - 5] = Math.floor(bits / 2 ** 32);
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a, h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  for (let o = 0; o < nb; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = (m[o + i * 4] << 24) | (m[o + i * 4 + 1] << 16) | (m[o + i * 4 + 2] << 8) | m[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) {
      const a = W[i - 15], b = W[i - 2];
      const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3), s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7)), ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + W[i]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10)), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
  }
  const out = new Uint8Array(32), dv = new DataView(out.buffer);
  [h0, h1, h2, h3, h4, h5, h6, h7].forEach((x, i) => dv.setUint32(i * 4, x >>> 0));
  return out;
}
const cat = (...a) => { const r = new Uint8Array(a.reduce((s, x) => s + x.length, 0)); let o = 0; for (const x of a) { r.set(x, o); o += x.length; } return r; };
const good = k => k?.length === 32 && hex(sha256(cat(k, enc("gate")))).slice(0, 32) === CHECK;
async function derive(pin) {
  const base = await crypto.subtle.importKey("raw", enc(pin), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc(SALT), iterations: ITER }, base, 256));
}
const path = location.pathname.replace(/[^/]*$/, "");
function stored() {
  try { const v = localStorage.getItem(NAME); if (v) return unhex(v); } catch { /* приватный режим */ }
  const c = document.cookie.split("; ").find(x => x.startsWith(NAME + "="));
  return c ? unhex(c.slice(NAME.length + 1)) : null;
}
function remember(k) {
  try { localStorage.setItem(NAME, hex(k)); } catch { /* без localStorage — останется cookie */ }
  document.cookie = `${NAME}=${hex(k)}; max-age=31536000; path=${path}; SameSite=Lax; Secure`;
}
function decrypt(buf, k) {
  if (String.fromCharCode(...buf.slice(0, 4)) !== "AKM1") throw new Error("файл не зашифрован");
  const nonce = buf.slice(4, 20), ct = buf.subarray(36);
  if (hex(sha256(cat(k, nonce, enc("ok")))).slice(0, 32) !== hex(buf.slice(20, 36))) throw new Error("неверный ключ — обновите страницу");
  const pre = cat(k, nonce, new Uint8Array(4)), out = new Uint8Array(ct.length);
  for (let i = 0, o = 0; o < ct.length; i++, o += 32) {
    pre[48] = i >>> 24; pre[49] = i >>> 16; pre[50] = i >>> 8; pre[51] = i;
    const s = sha256(pre), n = Math.min(32, ct.length - o);
    for (let j = 0; j < n; j++) out[o + j] = ct[o + j] ^ s[j];
  }
  return out;
}

function showGate(done) {
  const css = `#akmGate{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:16px;background:radial-gradient(900px circle at 20% 10%,#2b3d34,#0f1714 60%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
  #akmGate form{width:min(380px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:30px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);backdrop-filter:blur(8px)}
  #akmGate .lg{font-weight:700;font-size:26px;letter-spacing:-.04em}#akmGate .lg span{color:#D5FF72}
  #akmGate p{margin:0;font-size:14px;opacity:.72;line-height:1.4}
  #akmGate input{font:600 24px/1 system-ui,sans-serif;letter-spacing:.3em;text-align:center;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;padding:16px 12px;outline:none}
  #akmGate input:focus{border-color:#D5FF72;box-shadow:0 0 0 4px rgba(213,255,114,.18)}
  #akmGate button{font:600 16px system-ui,sans-serif;border:0;border-radius:999px;padding:15px;background:#D5FF72;color:#14251E;cursor:pointer}
  #akmGate button:disabled{opacity:.6;cursor:wait}
  #akmGate .hint{font-size:13px;opacity:.6;text-align:center}#akmGate .err{color:#FF9A8A;font-size:13.5px;text-align:center;min-height:18px}
  #akmGate .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #akmGate.shake form{animation:akmShake .4s}@keyframes akmShake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}`;
  const g = document.createElement("div"); g.id = "akmGate";
  g.innerHTML = `<style>${css}</style><form method="post" action="#" autocomplete="on">
    <div class="lg">AKM<span>.</span></div><p>Статистика сетки — только для своих. Введите пинкод.</p>
    <input class="sr" type="text" name="username" autocomplete="username" value="AKM" tabindex="-1" aria-hidden="true">
    <label class="sr" for="akmPin">Пинкод</label>
    <input id="akmPin" type="password" name="password" autocomplete="current-password" inputmode="numeric" placeholder="••••••••" required autofocus>
    <div class="err" role="alert"></div><button type="submit">Войти</button>
    <div class="hint">Подсказка: пароль от wifi в офисе</div></form>`;
  const add = () => { document.body.appendChild(g); g.querySelector("#akmPin").focus(); };
  document.body ? add() : addEventListener("DOMContentLoaded", add);
  g.querySelector("form").addEventListener("submit", async e => {
    e.preventDefault();
    const pin = g.querySelector("#akmPin").value.trim(), btn = g.querySelector("button"), err = g.querySelector(".err");
    btn.disabled = true; err.textContent = "";
    try {
      const k = await derive(pin);
      if (!good(k)) { err.textContent = "Неверный пинкод"; g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake"); return; }
      remember(k);
      try { if (window.PasswordCredential) await navigator.credentials.store(new PasswordCredential({ id: "AKM", password: pin, name: "AKM" })); } catch { /* браузер без Credential API */ }
      g.remove(); done(k);
    } catch (x) { err.textContent = "Не получилось: " + x.message; }
    finally { btn.disabled = false; }
  });
}

const k0 = stored();
window.akmKey = new Promise(res => good(k0) ? res(k0) : showGate(res));
window.akmData = async name => {
  const k = await window.akmKey;
  const r = await fetch("data/" + name.replace(/\.json$/, "") + ".enc?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return JSON.parse(new TextDecoder().decode(decrypt(new Uint8Array(await r.arrayBuffer()), k)));
};
window.akmLogout = () => { try { localStorage.removeItem(NAME); } catch { /* */ } document.cookie = `${NAME}=; max-age=0; path=${path}`; location.reload(); };
})();
</script><!--akm-gate--><meta name="viewport" content="width=device-width,initial-scale=1"><title>Контент Карусели · AKM</title><meta http-equiv="refresh" content="0;url=index.html#content-carousels"></head><body style="background:#e9e8e3;font:16px system-ui;padding:40px"><a href="index.html#content-carousels">Открыть «Конкуренты Контент Карусели» →</a></body></html>
